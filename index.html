<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夜市娃娃小岛 · 网页预览</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12b3a6">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f1ea; --content:#fff; --ink:#4a4136; --ink2:#6b5a45; --sec:#978973; --line:#ece2d3;
    --primary:#12b3a6; --primary-d:#0d938a; --primary-soft:#e3f6f3; --shadow:#cdbfab;
    --pink:#f6a8b4; --purple:#b189e8; --blue:#7f9bf2; --yellow:#f5c752; --orange:#ef9a5c;
    --teal:#4fc7bc; --green:#7cc47a; --red:#f2706a; --success:#57ac3f; --warning:#eab308; --error:#e05a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#dfd9cd;color:var(--ink);
    font-family:'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:500;
    display:flex;justify-content:center;min-height:100vh;
  }
  /* 手机外观 */
  .phone{
    width:100%;max-width:420px;height:100vh;height:100dvh;background:var(--bg);
    position:relative;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.18);
  }
  @media(min-width:480px){ .phone{margin:18px 0;border-radius:34px;min-height:auto;height:calc(100vh - 36px);max-height:880px} }
  .navbar{
    background:var(--primary);color:#fff;border-radius:0 0 22px 22px;
    padding:16px 18px;box-shadow:0 4px 0 0 rgba(13,147,138,.45);
    display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;
  }
  .navbar .t{font-size:18px;font-weight:800;letter-spacing:.02em}
  .navbar .s{font-size:12px;font-weight:600;opacity:.92;margin-top:3px}
  .navbar .badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:20px}
  .scroll{flex:1 1 auto;overflow-y:auto;padding:14px 14px 92px}
  .scroll::-webkit-scrollbar{width:0}

  .card{background:var(--content);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(74,65,54,.05)}
  .section-title{font-size:15px;font-weight:800;margin:16px 2px 10px}
  .card-h{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}

  .btn{border:none;border-radius:50px;padding:13px;font-weight:700;font-size:15px;color:var(--ink);background:#fff;box-shadow:0 2px 4px rgba(61,52,40,.08);text-align:center;line-height:1.2;cursor:pointer;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:none}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 0 var(--primary-d)}
  .btn-green{background:var(--success);color:#fff;box-shadow:0 4px 0 0 #468a32}
  .btn-warn{background:var(--warning);color:#5a4a16;box-shadow:0 4px 0 0 #c69406}
  .btn-danger{background:var(--error);color:#fff;box-shadow:0 4px 0 0 #b84545}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--sec);box-shadow:none}
  .btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-block}
  .btn-xs{padding:6px 11px;font-size:12px;width:auto;display:inline-block;border-radius:50px}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{border-radius:18px;padding:13px;color:#fff;box-shadow:0 3px 0 0 rgba(74,65,54,.1)}
  .stat .n{font-size:25px;font-weight:900;line-height:1}
  .stat .l{font-size:11px;font-weight:700;margin-top:5px;display:block;opacity:.95}

  .row{display:flex;align-items:center;gap:10px;background:var(--content);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 2px 6px rgba(74,65,54,.04)}
  .name{font-weight:800;font-size:14px}
  .meta{font-size:12px;color:var(--sec);margin-top:4px;font-weight:600;line-height:1.5}
  .tag{border-radius:50px;padding:2px 9px;font-size:10px;font-weight:800;display:inline-block}
  .t-out{background:var(--error);color:#fff}.t-low{background:var(--warning);color:#5a4a16}
  .t-ok{background:var(--success);color:#fff}.t-slow{background:#e0d6c2;color:#6b5a2a}
  .thumb{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--primary-soft);flex:0 0 54px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
  .thumb img{width:100%;height:100%;object-fit:cover}

  .input{width:100%;background:#fbf9f4;border:1.5px solid var(--sec);border-radius:50px;padding:11px 16px;font-size:14px;color:var(--ink);font-weight:600;font-family:inherit}
  .label{font-size:12px;font-weight:800;color:var(--ink2);margin:10px 0 4px;display:block}
  .tip{font-size:12px;font-weight:600;color:var(--ink2);background:var(--primary-soft);border:1.5px solid #cfeae6;border-radius:12px;padding:10px;margin-top:8px;line-height:1.6}
  .empty{text-align:center;color:var(--sec);padding:22px 0;font-size:13px;font-weight:600}
  .op-bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .op-bar .btn-xs{flex:0 0 auto}
  .op-del{color:var(--error);border-color:var(--error)}
  .btn-del{background:var(--error);color:#fff;box-shadow:0 4px 0 0 #b84545;margin-top:16px}
  .btn-del.armed{background:#a11f1f;box-shadow:0 4px 0 0 #6f1414;animation:delpulse 1s infinite}
  @keyframes delpulse{0%,100%{opacity:1}50%{opacity:.65}}
  .del-zone{margin-top:6px}
  .del-divider{height:1px;background:var(--line);margin:18px 0 0}
  .del-hint{font-size:12px;color:var(--sec);text-align:center;margin-top:8px;line-height:1.4}

  /* 底部 tab */
  .tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .tab{flex:1;text-align:center;padding:6px 2px;color:var(--sec);font-size:11px;font-weight:700;cursor:pointer;border-radius:14px}
  .tab .ic{font-size:21px;display:block;line-height:1.1;filter:grayscale(.3)}
  .tab.on{color:var(--primary)}
  .tab.on .ic{filter:none}
  .fab{position:absolute;right:16px;bottom:74px;z-index:25;background:var(--primary);color:#fff;border:none;border-radius:50px;font-weight:800;font-size:14px;padding:12px 16px;box-shadow:0 5px 0 0 var(--primary-d);cursor:pointer}
  .fab:active{transform:translateY(3px);box-shadow:none}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(61,52,40,.4);z-index:40}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px 26px;z-index:41;box-shadow:0 -4px 20px rgba(61,52,40,.18);max-width:420px;margin:0 auto;max-height:95vh;overflow-y:auto}
  .sheet-h{font-size:17px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;padding-bottom:8px}
  .x{border:none;background:var(--primary-soft);color:var(--primary-d);width:30px;height:30px;border-radius:50%;font-size:16px;font-weight:800;cursor:pointer}

  /* 业绩日历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head .m{font-weight:800;font-size:15px}
  .cal-head button{border:1.5px solid var(--line);background:#fff;border-radius:50px;padding:6px 12px;font-weight:800;cursor:pointer;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wd{text-align:center;font-size:11px;font-weight:800;color:var(--sec);padding:2px 0}
  .cal-cell{height:46px;border-radius:10px;background:#f6f2ea;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:2px;cursor:pointer}
  .cal-cell .d{font-size:12px;font-weight:800;color:var(--ink)}
  .cal-cell .r{font-size:9px;color:var(--ink2);margin-top:1px}
  .cal-cell.lv0{background:#f6f2ea}
  .cal-cell.lv1{background:#cdeee9}.cal-cell.lv2{background:#9dded6}.cal-cell.lv3{background:#5fc6ba}.cal-cell.lv4{background:var(--primary);color:#fff}
  .cal-cell.lv4 .d,.cal-cell.lv4 .r{color:#fff}
  .cal-cell.today .d{border:2px solid var(--yellow);border-radius:50%;width:20px;height:20px;line-height:16px;display:inline-block}
  .cal-cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
  .cal-cell.blank{background:transparent;cursor:default}

  /* 排行榜 */
  .rank-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .rank-row .nm{flex:1;min-width:0}
  .rank-row .bar{height:9px;background:var(--primary-soft);border-radius:50px;overflow:hidden;margin-top:4px}
  .rank-row .bar i{display:block;height:100%;background:var(--primary);border-radius:50px}
  .rank-row .v{font-weight:800;font-size:13px;white-space:nowrap;text-align:right}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line)}
  .tbl th{font-weight:800;background:var(--primary);color:#fff}
  @media(min-width:480px){ .tbl th:first-child,.tbl td:first-child{border-radius:0} }
  .sale-del{display:inline-block;color:#e35d6a;font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(227,93,106,0.1);cursor:pointer;white-space:nowrap}
  .sale-del:active{opacity:.7}

  .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sec);font-weight:600;margin-top:8px;flex-wrap:wrap}
  .legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
  .crop-stage{position:fixed;inset:0;background:rgba(61,52,40,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
  .crop-stage img{max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,.3);cursor:crosshair}
  .crop-hint{color:#fff;font-weight:700;font-size:14px;margin-bottom:10px}
  .crop-done{background:#fff;color:var(--primary-d);border:none;border-radius:50px;padding:10px 24px;font-weight:700;margin-top:12px;cursor:pointer}
  .ai-grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:380px){ .ai-grid{grid-template-columns:1.1fr 0.9fr} }
  .ai-img-wrap{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;position:relative;min-height:120px;max-height:260px;display:flex;align-items:center;justify-content:center}
  .ai-img-wrap img{max-width:100%;max-height:260px;object-fit:contain}
  .ai-img-note{position:absolute;bottom:0;left:0;right:0;background:rgba(74,65,54,.75);color:#fff;font-size:11px;font-weight:700;padding:5px;text-align:center}
  .chip-list{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:50px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:active{background:var(--primary-soft);border-color:var(--primary)}
  .chip-price{border-color:var(--teal);color:var(--primary-d)}
  .ai-item{border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;background:#fff}
  .ai-item-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .ai-item-h .n{font-weight:800;font-size:14px}
  .ai-item .thumb{width:48px;height:48px;border-radius:12px;flex:0 0 48px}
  .inline-btn{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary-d);border:1.5px solid #cfeae6;border-radius:50px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
  /* 居中自动消失小弹窗：固定定位、不占布局、1 秒后淡出 */
  .toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(-6px);background:rgba(40,32,24,.92);color:#fff;font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .15s ease, transform .15s ease;z-index:200;max-width:82%;text-align:center;letter-spacing:.2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <div>
      <div class="t" id="navTitle">夜市娃娃小岛</div>
      <div class="s" id="navSub">摆摊记账 · 补货提醒</div>
    </div>
    <div class="badge" id="navBadge">网页预览</div>
  </div>
  <div class="scroll" id="page"></div>
  <button class="fab" id="fab" style="display:none" onclick="quickOpen()">⚡ 记一笔</button>
  <div class="tabbar" id="tabbar"></div>
</div>

<script>
/* ============ 全局报错兜底：任何错误都显示在页面上，不再白屏 ============ */
function showFatal(msg){
  var el=document.getElementById('page'); if(!el) return;
  el.innerHTML='<div class="card" style="border:2px solid #c92a2a"><div class="card-h" style="color:#c92a2a">⚠ 页面出错</div><div class="meta" style="white-space:pre-wrap;word-break:break-all">'+String(msg).replace(/</g,'&lt;')+'</div><div class="meta">请刷新重试；如仍不行，把这段红字发我即可。</div></div>';
}
window.addEventListener('error', function(e){ showFatal((e&&e.message)||(e&&e.error)||'未知错误'); });

/* ============ 数据存储：localStorage 存元数据 + IndexedDB 存商品图片 ============
   之前把商品图 base64 直接塞 localStorage，几张图就会触发 QuotaExceededError。
   现在：localStorage 只存剥离图片后的元数据（小、体积稳），商品图改存 IndexedDB（配额按设备剩余空间，几百 MB 级别）。
   启动时自动从 IDB 回填图片到内存；并把旧 localStorage 里的 base64 图片迁移到 IDB。 */
const KEY='ye_shi_wa_wa_web';
const IDB_NAME='yeshi_wa_wa';
const IDB_STORE='product_imgs';

/* 通用工具（uid/日期）— seed 与日历、记一笔等地方都用到，必须保留 */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function z(n){return ('0'+n).slice(-2);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function daysAgoISO(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}

var _idb=null, _idbFailed=false;

function openImgDB(){
  return new Promise(function(res,rej){
    if(_idbFailed) return rej(new Error('idb-disabled'));
    if(_idb) return res(_idb);
    if(typeof indexedDB==='undefined'){ _idbFailed=true; return rej(new Error('no-idb')); }
    try{
      var r=indexedDB.open(IDB_NAME,1);
      r.onupgradeneeded=function(){
        if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE);
      };
      r.onsuccess=function(){ _idb=r.result; res(_idb); };
      r.onerror=function(){ _idbFailed=true; rej(r.error||new Error('idb-open-fail')); };
      r.onblocked=function(){ _idbFailed=true; rej(new Error('idb-blocked')); };
    }catch(e){ _idbFailed=true; rej(e); }
  });
}
function idbAll(){
  return openImgDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(IDB_STORE,'readonly');
        var s=tx.objectStore(IDB_STORE);
        var k=s.getAllKeys(), v=s.getAll();
        k.onsuccess=function(){ v.onsuccess=function(){ res({keys:k.result||[], values:v.result||[]}); }; };
        k.onerror=function(){ rej(k.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbSet(key,val){
  return openImgDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(val,key);
        tx.oncomplete=res; tx.onerror=function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbDel(key){
  return openImgDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete=res; tx.onerror=function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}

function _persistMeta(){
  // 把每个商品的 image 字段置空后再写 localStorage（图片在 IDB 里）
  var slim={products:DB.products.map(function(p){return Object.assign({},p,{image:''});}),tx:DB.tx,settings:DB.settings,seeded:DB.seeded};
  try{ localStorage.setItem(KEY, JSON.stringify(slim)); }
  catch(e){
    if(e && (e.name==='QuotaExceededError' || e.code===22)){
      try{ toast('本地存储已满，请到「设置」导出备份后清理'); }catch(_){}
    } else { throw e; }
  }
}
function _loadImagesFromIDB(){
  openImgDB().then(function(){ return idbAll(); })
  .then(function(r){
    var map={};
    for(var i=0;i<r.keys.length;i++) map[r.keys[i]]=r.values[i];
    var mig=[];
    var filled=false;
    DB.products.forEach(function(p){
      if(!p.image && map[p.id]){ p.image=map[p.id]; filled=true; }
      if(p.image && /^data:/.test(p.image)) mig.push(idbSet(p.id, p.image));
    });
    if(mig.length){
      Promise.all(mig).then(function(){ try{_persistMeta();}catch(_){} }, function(){ /* 迁移失败就保持原样，save() 会自动回退 */ });
    }
    if(filled){ try{ render(); }catch(_){ } }
  })
  .catch(function(){ _idbFailed=true; });
}
function load(){
  var r=JSON.parse(localStorage.getItem(KEY)||'null');
  if(r && r.products) DB=r;
  if(!DB.settings) DB.settings={restockDays:7,periodDays:30,defaultSafety:10,catTemplates:[],slowDays:14,slowThreshold:0.2};
  if(DB.settings.defaultSafety==null) DB.settings.defaultSafety=10;
  if(!Array.isArray(DB.settings.catTemplates)) DB.settings.catTemplates=[];
  if(DB.settings.slowDays==null) DB.settings.slowDays=14;
  if(DB.settings.slowThreshold==null) DB.settings.slowThreshold=0.2;
  if(!DB.seeded && (!DB.products||!DB.products.length)){
    var s=seed(); DB.products=s.products; DB.tx=s.tx; DB.seeded=true;
    _persistMeta();
  }
  _loadImagesFromIDB();
  return DB;
}
function save(){
  // IDB 不可用时：图片与元数据一起写 localStorage（老行为，保证不丢）
  if(_idbFailed){
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){
      if(e && (e.name==='QuotaExceededError' || e.code===22)){ try{toast('存储已满，请到设置页导出备份');}catch(_){} }
      else throw e;
    }
    return;
  }
  // 正常路径：图片写 IDB，元数据写 localStorage
  var tasks=[];
  DB.products.forEach(function(p){
    if(p.image && /^data:/.test(p.image)) tasks.push(idbSet(p.id, p.image));
    else tasks.push(idbDel(p.id));
  });
  Promise.all(tasks).then(function(){ _persistMeta(); }, function(){
    // 任一图片写 IDB 失败 → 回退到把图片也写进 localStorage（不丢图），下次再试 IDB
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){
      if(e && (e.name==='QuotaExceededError' || e.code===22)){ try{toast('存储已满，请到设置页导出备份');}catch(_){} }
    }
  });
}
var DB={products:[],tx:[],settings:{restockDays:7,periodDays:30,defaultSafety:10,catTemplates:['三丽鸥','自嘲熊','线条小狗','玉桂狗','星之卡比','盲盒','卡通','钥匙扣','其他'],slowDays:14,slowThreshold:0.2}};

/* 图片压缩：手机拍的照片动辄好几M，直接转 base64 存 localStorage 会卡死甚至超容量。
   这里缩到最长边 800px、JPEG 0.72，单张一般 50~120KB，既不卡也存得下。 */
function compressImage(file,cb,maxDim,quality){
  maxDim=maxDim||800;quality=quality||0.72;
  const r=new FileReader();
  r.onload=function(){
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;
      if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}
      else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
      try{
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',quality));
      }catch(e){cb(r.result);}
    };
    img.onerror=function(){cb(r.result);};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

function seed(){

    {name:'玉桂狗钥匙扣',cat:'钥匙扣',cost:3,price:10,stock:25,safe:12,rate:0.8},
    {name:'屁桃君挂件',cat:'卡通',cost:6,price:18,stock:5,safe:10,rate:1.0},
    {name:'挂饰 新年平安果 kt',cat:'三丽鸥',cost:12.1,price:35,stock:0,safe:10,rate:2.5}
  ];
  const products=base.map(b=>({id:uid(),name:b.name,cat:b.cat||'',cost:b.cost,price:b.price,stock:b.stock,safetyStock:b.safe,unit:'个',image:'',createdAt:Date.now()}));
  const tx=[];
  base.forEach((b,i)=>{const pid=products[i].id;for(let d=0;d<30;d++){const qty=Math.max(0,Math.round(b.rate+(Math.sin(d*1.3+i)*0.6)));if(qty>0)tx.push({id:uid(),productId:pid,type:'sale',qty:qty,date:daysAgoISO(d),note:''});}});
  return {products,tx};
}

/* ============ 统计算法（与小程序一致） ============ */
function analytics(p,db){
  const settings=db.settings,now=Date.now(),pm=settings.periodDays*86400000;
  const sales=db.tx.filter(t=>t.productId===p.id&&t.type==='sale'&&(now-new Date(t.date).getTime())<=pm);
  const totalSold=sales.reduce((s,t)=>s+t.qty,0);
  const avgDaily=totalSold/settings.periodDays;
  const coverDays=avgDaily>0?p.stock/avgDaily:Infinity;
  const need=Math.max(0,Math.ceil(avgDaily*settings.restockDays)-p.stock);
  const status=p.stock<=0?'out':(p.stock<p.safetyStock?'low':'ok');
  // 滞销判断：仅当①还有库存 ②上架满 slowDays 天（新品不算） ③日均<slowThreshold 才算滞销
  const ageDays=p.createdAt?(now-p.createdAt)/86400000:999;
  const slowDays=settings.slowDays||14, slowThreshold=settings.slowThreshold!=null?settings.slowThreshold:0.2;
  const slow=p.stock>0&&ageDays>=slowDays&&avgDaily<slowThreshold;
  return {totalSold,avgDaily,coverDays,need,status,slow};
}
function todaySales(db){const tod=todayISO();let qty=0,rev=0,cost=0;db.tx.forEach(x=>{if(x.type==='sale'&&x.date===tod){qty+=x.qty;const p=db.products.find(y=>y.id===x.productId);const amt=x.amount!=null?x.amount:(p?p.price*x.qty:0);rev+=amt;cost+=(p?p.cost*x.qty:0);}});return{qty,rev,cost,profit:rev-cost};}
function monthSales(db){const m=todayISO().slice(0,7);let qty=0,rev=0,cost=0;db.tx.forEach(x=>{if(x.type==='sale'&&x.date.slice(0,7)===m){qty+=x.qty;const p=db.products.find(y=>y.id===x.productId);const amt=x.amount!=null?x.amount:(p?p.price*x.qty:0);rev+=amt;cost+=(p?p.cost*x.qty:0);}});return{qty,rev,cost,profit:rev-cost};}

  // 售出记录默认只显示近 3 天，点「展开」看全部

  const y=calState.y,mth=calState.m,prefix=y+'-'+z(mth+1)+'-';

  const firstWd=new Date(y,mth,1).getDay(),daysInMonth=new Date(y,mth+1,0).getDate(),todayI=todayISO();

function exportData(){

function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let data;try{data=JSON.parse(r.result);}catch(e){toast('文件无效');return;}

      if(confirm('导入将覆盖当前所有数据，确定继续？')){if(data.settings===undefined)data.settings={restockDays:7,periodDays:30};DB=data;save();toast('导入成功');render();}};
    r.readAsText(f);};

let _tessLoad=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tessLoad) return _tessLoad;
  _tessLoad=new Promise(function(res,rej){
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
    s.onload=function(){res(window.Tesseract);};
    s.onerror=function(){rej(new Error('识别组件加载失败'));};document.head.appendChild(s);
  });
  return _tessLoad;
}

function extractPriceCandidates(text){
  const lines=text.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
  const totalKw=/实付|合计|总价|共|小计|运费|优惠|满减|折扣|到手价|券后|补贴价|原价|定金|尾款/;
  const cand=[];
  lines.forEach(function(line){
    if(totalKw.test(line)) return;
    const ms=line.match(/¥\s?(\d+(?:\.\d+)?)/g);
    if(ms){ms.forEach(function(mm){const v=parseFloat(mm.replace(/[¥\s]/g,''));if(v>0&&v<500)cand.push({val:v,line:line});});}
  });
  if(!cand.length){
    lines.forEach(function(line){
      if(totalKw.test(line)) return;
      const ms=line.match(/\b(\d{1,3}(?:\.\d{1,2})?)\b/g);
      if(ms){ms.forEach(function(mm){const v=parseFloat(mm);if(v>0&&v<500)cand.push({val:v,line:line});});}
    });
  }
  return cand;
}
function extractNameCandidates(text){
  const junk=/^(申请|退款|再次|拼单|催发货|实付|合计|总价|共|小计|运费|优惠|满减|折扣|到手价|券后|补贴价|拼团|秒杀|百亿|补贴|特价|团购|立减|7天无理由|退货|预计|小时内|发货|商家|打包|成功|潜力好店|店|官方|旗舰店|自营店|大小)/;
  return text.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){
    return s.length>=5 && s.length<=70 && /[\u4e00-\u9fa5]/.test(s) && !/¥/.test(s) && !/^\d+(\.\d+)?$/.test(s) && !/^[\d\s\¥\.\,\×xX]+$/.test(s) && !junk.test(s);
  }).slice(0,30);
}

function aiBuildMulti(text){
  const prices=extractPriceCandidates(text);
  const names=extractNameCandidates(text);
  const uniqPrices=[];
  prices.forEach(function(c){if(uniqPrices.indexOf(c.val)===-1)uniqPrices.push(c.val);});
  const nameChips=names.length?'<div class="chip-list">'+names.map(function(n,i){return '<span class="chip" onclick="aiFillName('+i+',this)" data-name="'+esc(n)+'">'+esc(n)+'</span>';}).join('')+'</div>':'<div class="meta">未识别到合适商品名，请手动输入</div>';
  const priceChips=uniqPrices.length?'<label class="label">识别到的价格（点选填充进货价）</label><div class="chip-list">'+uniqPrices.map(function(v){return '<span class="chip chip-price" onclick="aiFillPrice('+v+')">¥'+v+'</span>';}).join('')+'</div>':'<div class="meta">未识别到价格，请手动输入</div>';
  const autoCount=Math.max(1,Math.min(names.length,6));
  const autoItems=[];
  for(let i=0;i<autoCount;i++){
    autoItems.push({name:names[i]||'',cost:uniqPrices[i]||'',price:'',stock:'',image:'',cat:'',safetyStock:DB.settings.defaultSafety!=null?DB.settings.defaultSafety:10});
  }
  window._aiItems=autoItems;
  window._aiText=text;
  window._aiNames=names;
  window._aiPrices=uniqPrices;
  window._aiActiveIdx=0;
  const h=`<div class="ai-grid">
    <div>
      <div class="ai-img-wrap" id="aiImgWrap" onclick="aiCropStart(-1)">
        <img src="${window._aiImg}" id="aiImgTag">
        <div class="ai-img-note">点击图片可选择/裁剪商品小图</div>
      </div>
      <label class="label" style="margin-top:10px">识别到的商品名（点选）</label>
      ${nameChips}
      ${names.length?'<div class="tip" style="margin-top:6px">已按顺序自动填入左侧，若不对，点名字即可替换当前商品</div>':''}
    </div>
    <div>
      ${priceChips}
      ${uniqPrices.length?'<div class="tip" style="margin-top:6px">价格已自动填入「进货价」，点价格可替换当前编辑商品</div>':''}
    </div>
  </div>
  <div id="aiItems"></div>
  <button class="btn btn-primary" style="margin-top:12px" onclick="aiAddItem()">＋ 添加一个商品</button>
  <button class="btn btn-green" style="margin-top:8px" onclick="aiConfirmMulti()">批量添加</button>
  <div class="tip" style="margin-top:8px">已按截图顺序自动生成商品卡片，检查名字/价格即可点「批量添加」。如需配图，点商品卡片左边的小图或「从图片裁剪小图」选对应位置。</div>`;
  document.getElementById('aiResult').innerHTML=h;
  renderAiItems();
  aiFocusItem(0);
}

    <div class="crop-hint">点击图片上该商品的位置，会自动裁剪出小图（点空白处取消）</div>

  </div>`;

function aiCropClick(e){
  const img=document.getElementById('aiCropImg');if(!img)return;
  const rect=img.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const naturalW=img.naturalWidth,naturalH=img.naturalHeight;
  const scaleX=naturalW/rect.width,scaleY=naturalH/rect.height;
  const nx=x*scaleX,ny=y*scaleY;
  const size=Math.min(naturalW,naturalH,260);
  let cx=Math.max(size/2,Math.min(naturalW-size/2,nx));let cy=Math.max(size/2,Math.min(naturalH-size/2,ny));
  let sx=Math.max(0,cx-size/2),sy=Math.max(0,cy-size/2);
  const c=document.createElement('canvas');c.width=size;c.height=size;
  c.getContext('2d').drawImage(img,sx,sy,size,size,0,0,size,size);
  const data=c.toDataURL('image/jpeg',0.72);
  const idx=window._aiCropIdx;
  if(idx>=0&&window._aiItems[idx]){
    window._aiItems[idx].image=data;
    const thumb=document.getElementById('aiThumb'+idx);if(thumb)thumb.innerHTML='<img src="'+data+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">';
  }
  const s=document.getElementById('aiCropStage');if(s)s.remove();aiFocusItem(idx);
}

function aiConfirmMulti(){

  if(!items.length){toast('请至少添加一个商品');return;}
  let added=0,skip=0;
  items.forEach(function(pair){
    const idx=pair.i;const it=pair.it;
    const name=(document.getElementById('aiName'+idx).value||'').trim();
    if(!name){skip++;return;}
    if(DB.products.some(function(p){return p.name===name;})){skip++;return;}
    const catVal=(document.getElementById('aiCat'+idx).value||'').trim();
    const safe=Number(document.getElementById('aiSafe'+idx).value)||(DB.settings.defaultSafety||10);

  });
  save();aiClose();toast('已添加 '+added+' 个'+(skip?'，跳过 '+skip+' 个':''));render();
}

/* ===== 本地 OCR 增强：图像预处理 + 单品框选识别 ===== */
function preprocessForOCR(src,cb){
  try{
    const img=new Image();img.onload=function(){
      try{
        let w=img.width,h=img.height;
        const scale=w<1400?2:1;
        w=Math.round(w*scale);h=Math.round(h*scale);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const ctx=c.getContext('2d');if(!ctx){cb(src);return;}
        ctx.drawImage(img,0,0,w,h);
        let data;try{data=ctx.getImageData(0,0,w,h);}catch(e){cb(c.toDataURL('image/png'));return;}
        const d=data.data;const k=1.7;
        for(let i=0;i<d.length;i+=4){
          let gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
          gray=(gray-128)*k+128;
          if(gray<0)gray=0;else if(gray>255)gray=255;
          d[i]=d[i+1]=d[i+2]=gray;
        }
        ctx.putImageData(data,0,0);
        cb(c.toDataURL('image/png'));
      }catch(e){cb(src);}
    };img.onerror=function(){cb(src);};img.src=src;
  }catch(e){cb(src);}
}
function aiRegionStart(){
  const prev=document.getElementById('aiPrev');
  if(!prev||!prev.querySelector('img')){toast('请先上传图片');return;}
  const stage=document.createElement('div');stage.id='aiRegionStage';
  stage.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column';
  const box=document.createElement('div');box.style.cssText='position:relative;max-width:94vw;max-height:72vh;touch-action:none;user-select:none';
  const im=document.createElement('img');im.src=window._aiImg;im.style.cssText='max-width:94vw;max-height:72vh;display:block;border-radius:12px;pointer-events:none;-webkit-user-drag:none';
  const sel=document.createElement('div');sel.style.cssText='position:absolute;border:2px dashed #ffd54a;background:rgba(255,213,74,.18);display:none;box-sizing:border-box';
  const hint=document.createElement('div');hint.style.cssText='color:#fff;font-size:14px;margin-bottom:10px;padding:0 16px;text-align:center';hint.textContent='拖动框选一个商品（名称+价格区域），松手即识别；点空白处取消';
  box.appendChild(im);box.appendChild(sel);stage.appendChild(hint);stage.appendChild(box);document.body.appendChild(stage);
  let sx=0,sy=0,moving=false;
  function rect(){return im.getBoundingClientRect();}
  function pos(e){const r=rect();return {x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height};}
  function down(e){e.preventDefault();const p=pos(e);moving=true;sx=p.x;sy=p.y;sel.style.display='block';sel.style.left=p.x+'px';sel.style.top=p.y+'px';sel.style.width='0px';sel.style.height='0px';}
  function move(e){if(!moving)return;const p=pos(e);const x=Math.min(sx,p.x),y=Math.min(sy,p.y),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);sel.style.left=x+'px';sel.style.top=y+'px';sel.style.width=w+'px';sel.style.height=h+'px';}
  function up(e){if(!moving)return;moving=false;const p=pos(e);const w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
    if(w<20||h<20){sel.style.display='none';return;}
    const r=rect();const scaleX=im.naturalWidth/r.width,scaleY=im.naturalHeight/r.height;
    const nx=Math.round(Math.min(sx,p.x)*scaleX),ny=Math.round(Math.min(sy,p.y)*scaleY),nw=Math.round(w*scaleX),nh=Math.round(h*scaleY);
    stage.remove();aiRegionProcess(nx,ny,nw,nh);
  }
  box.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  stage.addEventListener('click',function(e){if(e.target===stage){stage.remove();window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);}});
}
function ensureAiResult(){
  if(document.getElementById('aiItems'))return;
  const res=document.getElementById('aiResult');if(!res)return;
  res.innerHTML='<div class="ai-grid"><div><div class="ai-img-wrap" id="aiImgWrap" onclick="aiCropStart(-1)"><img src="'+window._aiImg+'" id="aiImgTag"><div class="ai-img-note">点击图片可选择/裁剪商品小图</div></div><label class="label" style="margin-top:10px">单品识别结果</label><div class="tip" style="margin-top:6px">已按你框选的区域生成商品卡片，检查名字/价格即可点「批量添加」。继续框选可再加商品。</div></div><div></div></div><div id="aiItems"></div><button class="btn btn-primary" style="margin-top:12px" onclick="aiAddItem()">＋ 添加一个商品</button><button class="btn btn-green" style="margin-top:8px" onclick="aiConfirmMulti()">批量添加</button>';
}
function aiRegionProcess(nx,ny,nw,nh){
  if(!Array.isArray(window._aiItems))window._aiItems=[];
  const img=new Image();img.onload=function(){
    const c=document.createElement('canvas');c.width=nw;c.height=nh;
    c.getContext('2d').drawImage(img,nx,ny,nw,nh,0,0,nw,nh);
    const region=c.toDataURL('image/png');
    const ld=document.getElementById('aiLoading');if(ld){ld.style.display='block';ld.textContent='识别单品中…';}
    preprocessForOCR(region,function(proc){
      loadTesseract().then(function(T){return T.recognize(proc,'chi_sim+eng');}).then(function(r){
        if(ld)ld.style.display='none';
        const text=r.data.text||'';
        const names=extractNameCandidates(text);
        const prices=extractPriceCandidates(text);
        const name=names[0]||'';
        const cost=prices.length?String(prices[0].val):'';
        ensureAiResult();
        window._aiItems.push({name:name,cost:cost,price:'',stock:'',image:'',cat:'',safetyStock:DB.settings.defaultSafety!=null?DB.settings.defaultSafety:10});
        renderAiItems();aiFocusItem(window._aiItems.length-1);
        toast('已识别：'+(name||'未识别到名称')+(cost?(' ¥'+cost):''));
      }).catch(function(err){if(ld)ld.style.display='none';toast('单品识别失败：'+(err&&err.message||err));});
    });
  };img.onerror=function(){toast('图片加载失败');};img.src=window._aiImg;
}

/* 删除一笔售出记录（库存回滚） */
function delSale(id){
  const tx=DB.tx.find(x=>x.id===id);if(!tx)return;
  const p=DB.products.find(y=>y.id===tx.productId);
  const pname=p?p.name:'该商品';
  if(!confirm('删除这笔记录？\n将删除「'+pname+' 卖出 '+tx.qty+'」'+(p?('，并把库存补回 '+tx.qty+' 个。'):'。'))) return;

  DB.tx=DB.tx.filter(x=>x.id!==id);

}

/* 记账弹层 */
function openSheet(type,pid,label){
  const db=DB;let pidx=0;if(pid){const i=db.products.findIndex(p=>p.id===pid);if(i>=0)pidx=i;}
  const opts=db.products.map((p,i)=>`<option value="${i}" ${i===pidx?'selected':''}>${esc(p.name)}（库存${p.stock}）</option>`).join('');
  let title,btnText;
  if(label==='补货'){title='🛒 记补货';btnText='确认补货';}
  else{title=type==='sale'?'⚡ 记卖出':'📥 记进货';btnText=type==='sale'?'确认卖出':'确认进货';}
  const p0=db.products[pidx]||{price:0};
  const defPrice=type==='sale'?p0.price:0;
  const priceBlock=type==='sale'?`
    <label class="label">成交单价（讲价就改这里，默认标价 ¥${defPrice}）</label>
    <input class="input" id="sheetPrice" type="number" value="${defPrice}" oninput="updSheetTotal()">
    <div style="font-size:13px;color:#6b5d4b;margin:6px 0 2px">本笔合计：<b style="color:var(--primary-d);font-size:15px" id="sheetTotal">¥${(defPrice*1).toFixed(2)}</b></div>`:'';
  const h=`<div class="mask" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="sheet-h">${title}<button class="x" onclick="closeSheet()">×</button></div>
    <label class="label">商品</label>
    <select class="input" id="sheetPid" onchange="onSheetPid()">${opts}</select>
    <label class="label">数量</label>
    <input class="input" id="sheetQty" type="number" placeholder="输入数量" value="1" oninput="updSheetTotal()">
    ${priceBlock}
    <label class="label">备注（可选）</label>
    <input class="input" id="sheetNote" placeholder="如：客人讲价">
    <button class="btn btn-primary" style="margin-top:14px" onclick="saveTx('${type}','${label||''}')">${btnText}</button>
  </div>`;
  document.getElementById('page').insertAdjacentHTML('beforeend',h);
}
function updSheetTotal(){
  const pidEl=document.getElementById('sheetPid');if(!pidEl)return;
  const p=DB.products[parseInt(pidEl.value,10)];
  const pe=document.getElementById('sheetPrice');
  const price=pe?Number(pe.value)||0:0;
  const qty=Math.floor(Number(document.getElementById('sheetQty').value)||0);
  const el=document.getElementById('sheetTotal');if(el)el.textContent='¥'+(price*qty).toFixed(2);
}
function onSheetPid(){
  const pidEl=document.getElementById('sheetPid');if(!pidEl)return;
  const p=DB.products[parseInt(pidEl.value,10)];
  const pe=document.getElementById('sheetPrice');if(pe&&p)pe.value=p.price;
  updSheetTotal();
}
function closeSheet(){document.querySelectorAll('.mask,.sheet').forEach(e=>e.remove());}
function saveTx(type,label){
  const db=DB;const idx=parseInt(document.getElementById('sheetPid').value,10);
  const pid=db.products[idx]&&db.products[idx].id;
  const qty=Math.floor(Number(document.getElementById('sheetQty').value)||0);
  if(!pid){toast('请选择商品');return;}
  if(qty<=0){toast('数量需大于0');return;}
  const p=db.products.find(x=>x.id===pid);
  if(type==='sale'&&qty>p.stock){if(!confirm('库存只有 '+p.stock+'，仍记为卖出 '+qty+' 吗？'))return;}
  const price=type==='sale'?(Number((document.getElementById('sheetPrice')||{}).value)||0):0;
  const amount=type==='sale'?price*qty:(type==='purchase'?p.cost*qty:0);
  if(type==='sale')p.stock-=qty;else p.stock+=qty;
  db.tx.push({id:uid(),productId:pid,type,qty,amount:amount||undefined,date:todayISO(),note:document.getElementById('sheetNote').value});
  save();closeSheet();toast(label==='补货'?'已补货':(type==='sale'?'已卖出':'已进货'));render();
}

function saveProduct(editId){
  const name=(document.getElementById('pName').value||'').trim();
  if(!name){toast('请填写商品名称');return;}
  const f=document.getElementById('pImg').files[0];
  const finish=(img)=>{
    const data={name,cat:(document.getElementById('pCat').value||'').trim(),cost:Number(document.getElementById('pCost').value)||0,price:Number(document.getElementById('pPrice').value)||0,stock:Number(document.getElementById('pStock').value)||0,safetyStock:Number(document.getElementById('pSafe').value)||0,unit:'个',image:img};
    if(editId){Object.assign(DB.products.find(x=>x.id===editId),data);}else{DB.products.push({id:uid(),createdAt:Date.now(),...data});}
    save();closeSheet();toast((editId?'已保存「':'已添加「')+name+'」');render();
  };
  if(f){compressImage(f,finish);}else{
    // 编辑时若未重新选图，保留原图
    if(editId){const orig=DB.products.find(x=>x.id===editId);finish(orig.image||'');}else finish('');
  }
}
function deleteProduct(pid,pname){
  if(!confirm('确定删除「'+pname+'」吗？它的销售记录也会一并删除，无法恢复。'))return;
  DB.products=DB.products.filter(p=>p.id!==pid);
  DB.tx=DB.tx.filter(t=>t.productId!==pid);
  idbDel(pid).catch(function(){});
  save();closeSheet();toast('已删除「'+(pname||'商品')+'」');render();
}
let _delTimer=null;
function armDelete(pid){
  const btn=document.getElementById('delBtn');
  if(!btn)return;
  if(btn.dataset.armed==='1'){
    clearTimeout(_delTimer);
    const p=DB.products.find(x=>x.id===pid);
    deleteProduct(pid,p?p.name:'');
  }else{
    btn.dataset.armed='1';btn.classList.add('armed');btn.textContent='⚠ 再次点击确认删除';
    const hint=document.getElementById('delHint');if(hint)hint.textContent='5 秒内不再点击，将自动取消';
    _delTimer=setTimeout(function(){if(btn){btn.dataset.armed='';btn.classList.remove('armed');btn.textContent='🗑 删除此商品';const h2=document.getElementById('delHint');if(h2)h2.textContent='删除后该商品及全部销售记录将无法恢复';}},5000);
  }
}
function batchImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=()=>{const files=Array.from(inp.files).slice(0,9);if(!files.length)return;

}
