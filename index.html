<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>夜市娃娃小岛 · 预览 v2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#12b3a6">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f4f1ea; --content:#fff; --ink:#4a4136; --ink2:#6b5a45; --sec:#978973; --line:#ece2d3;
    --primary:#12b3a6; --primary-d:#0d938a; --primary-soft:#e3f6f3; --shadow:#cdbfab;
    --pink:#f6a8b4; --purple:#b189e8; --blue:#7f9bf2; --yellow:#f5c752; --orange:#ef9a5c;
    --teal:#4fc7bc; --green:#7cc47a; --red:#f2706a; --success:#57ac3f; --warning:#eab308; --error:#e05a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#dfd9cd;color:var(--ink);
    font-family:'Nunito','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-weight:500;
    display:flex;justify-content:center;min-height:100vh;
  }
  /* 手机外观 */
  .phone{
    width:100%;max-width:420px;height:100vh;height:100dvh;background:var(--bg);
    position:relative;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.18);
  }
  @media(min-width:480px){ .phone{margin:18px 0;border-radius:34px;min-height:auto;height:calc(100vh - 36px);max-height:880px} }
  .navbar{
    background:var(--primary);color:#fff;border-radius:0 0 22px 22px;
    padding:16px 18px;box-shadow:0 4px 0 0 rgba(13,147,138,.45);
    display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;
  }
  .navbar .t{font-size:18px;font-weight:800;letter-spacing:.02em}
  .navbar .s{font-size:12px;font-weight:600;opacity:.92;margin-top:3px}
  .navbar .badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:20px}
  .scroll{flex:1 1 auto;overflow-y:auto;padding:14px 14px 92px}
  .scroll::-webkit-scrollbar{width:0}

  .card{background:var(--content);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(74,65,54,.05)}
  .section-title{font-size:15px;font-weight:800;margin:16px 2px 10px}
  .card-h{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between}

  .btn{border:none;border-radius:50px;padding:13px;font-weight:700;font-size:15px;color:var(--ink);background:#fff;box-shadow:0 2px 4px rgba(61,52,40,.08);text-align:center;line-height:1.2;cursor:pointer;width:100%}
  .btn:active{transform:translateY(3px);box-shadow:none}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 0 0 var(--primary-d)}
  .btn-green{background:var(--success);color:#fff;box-shadow:0 4px 0 0 #468a32}
  .btn-warn{background:var(--warning);color:#5a4a16;box-shadow:0 4px 0 0 #c69406}
  .btn-danger{background:var(--error);color:#fff;box-shadow:0 4px 0 0 #b84545}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--sec);box-shadow:none}
  .btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-block}
  .btn-xs{padding:6px 11px;font-size:12px;width:auto;display:inline-block;border-radius:50px}
  .btn-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{border-radius:18px;padding:13px;color:#fff;box-shadow:0 3px 0 0 rgba(74,65,54,.1)}
  .stat .n{font-size:25px;font-weight:900;line-height:1}
  .stat .l{font-size:11px;font-weight:700;margin-top:5px;display:block;opacity:.95}

  .row{display:flex;align-items:center;gap:10px;background:var(--content);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;box-shadow:0 2px 6px rgba(74,65,54,.04)}
  .name{font-weight:800;font-size:14px}
  .meta{font-size:12px;color:var(--sec);margin-top:4px;font-weight:600;line-height:1.5}
  .tag{border-radius:50px;padding:2px 9px;font-size:10px;font-weight:800;display:inline-block}
  .t-out{background:var(--error);color:#fff}.t-low{background:var(--warning);color:#5a4a16}
  .t-ok{background:var(--success);color:#fff}.t-slow{background:#e0d6c2;color:#6b5a2a}
  .t-cat{background:var(--primary-soft);color:var(--primary-d)}
  .thumb{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--primary-soft);flex:0 0 54px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
  .thumb img{width:100%;height:100%;object-fit:cover}

  .input{width:100%;background:#fbf9f4;border:1.5px solid var(--sec);border-radius:50px;padding:11px 16px;font-size:14px;color:var(--ink);font-weight:600;font-family:inherit}
  select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sec) 50%),linear-gradient(135deg,var(--sec) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  .label{font-size:12px;font-weight:800;color:var(--ink2);margin:10px 0 4px;display:block}
  .tip{font-size:12px;font-weight:600;color:var(--ink2);background:var(--primary-soft);border:1.5px solid #cfeae6;border-radius:12px;padding:10px;margin-top:8px;line-height:1.6}
  .empty{text-align:center;color:var(--sec);padding:22px 0;font-size:13px;font-weight:600}
  .op-bar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .op-bar .btn-xs{flex:0 0 auto}
  .op-del{color:var(--error);border-color:var(--error)}
  .btn-del{background:var(--error);color:#fff;box-shadow:0 4px 0 0 #b84545;margin-top:16px}
  .btn-del.armed{background:#a11f1f;box-shadow:0 4px 0 0 #6f1414;animation:delpulse 1s infinite}
  @keyframes delpulse{0%,100%{opacity:1}50%{opacity:.65}}
  .del-zone{margin-top:6px}
  .del-divider{height:1px;background:var(--line);margin:18px 0 0}
  .del-hint{font-size:12px;color:var(--sec);text-align:center;margin-top:8px;line-height:1.4}

  /* 底部 tab */
  .tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .tab{flex:1;text-align:center;padding:6px 2px;color:var(--sec);font-size:11px;font-weight:700;cursor:pointer;border-radius:14px}
  .tab .ic{font-size:21px;display:block;line-height:1.1;filter:grayscale(.3)}
  .tab.on{color:var(--primary)}
  .tab.on .ic{filter:none}
  .fab{position:absolute;right:16px;bottom:74px;z-index:25;background:var(--primary);color:#fff;border:none;border-radius:50px;font-weight:800;font-size:14px;padding:12px 16px;box-shadow:0 5px 0 0 var(--primary-d);cursor:pointer}
  .fab:active{transform:translateY(3px);box-shadow:none}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(61,52,40,.4);z-index:40}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px 26px;z-index:41;box-shadow:0 -4px 20px rgba(61,52,40,.18);max-width:420px;margin:0 auto;max-height:95vh;overflow-y:auto}
  .sheet-h{font-size:17px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;padding-bottom:8px}
  .x{border:none;background:var(--primary-soft);color:var(--primary-d);width:30px;height:30px;border-radius:50%;font-size:16px;font-weight:800;cursor:pointer}

  /* 分类筛选条 */
  .chipbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 8px;scrollbar-width:none;-ms-overflow-style:none}
  .chipbar::-webkit-scrollbar{display:none}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:50px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .chip:active{background:var(--primary-soft);border-color:var(--primary)}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .chip-price{border-color:var(--teal);color:var(--primary-d)}
  .filter-card{background:var(--content);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px 4px;margin-bottom:12px;box-shadow:0 2px 6px rgba(74,65,54,.04)}

  /* 选商品弹层：搜索框与分类条固定在顶部，只有商品网格滚动 */
  .sheet.pick-sheet{padding:0;display:flex;flex-direction:column;overflow:hidden}
  .pick-head{flex:0 0 auto;padding:18px 18px 10px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 3px 10px rgba(74,65,54,.07);position:relative;z-index:2}
  .pick-head .sheet-h{position:static;margin-bottom:4px;padding-bottom:0}
  .pick-head .chipbar{padding-bottom:2px}
  .pick-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 18px 14px}
  .pick-foot{flex:0 0 auto;padding:10px 18px 16px;background:#fff;border-top:1.5px solid var(--line)}
  .pick-sold{color:var(--primary-d);font-weight:800}

  /* 选商品照片网格 */
  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .pick-item{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 2px 6px rgba(74,65,54,.05)}
  .pick-item:active{border-color:var(--primary);background:var(--primary-soft)}
  .pick-item.dis{opacity:.42}
  .pick-item .ph{width:100%;height:96px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
  .pick-item .ph img{width:100%;height:100%;object-fit:cover}
  .pick-item .bd{padding:7px 9px 9px}
  .pick-item .nm{font-size:12.5px;font-weight:800;line-height:1.3;height:33px;overflow:hidden}
  .pick-item .mt{font-size:11px;color:var(--sec);font-weight:700;margin-top:3px;display:flex;justify-content:space-between;gap:4px}
  .pick-item .mt .r{color:var(--primary-d);white-space:nowrap}

  /* 数量步进 */
  .qty-row{display:flex;align-items:center;gap:10px}
  .qty-btn{width:48px;height:46px;flex:0 0 48px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1}
  .qty-btn:active{background:var(--primary-soft);border-color:var(--primary)}
  .qty-input{text-align:center;font-size:18px;font-weight:800;padding:11px 6px}
  .sum-box{background:var(--primary-soft);border:1.5px solid #cfeae6;border-radius:14px;padding:12px;margin-top:12px}
  .sum-box .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700}
  .sum-box .l2{font-size:12px;font-weight:700;color:var(--ink2);margin-top:7px}

  /* 业绩日历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head .m{font-weight:800;font-size:15px}
  .cal-head button{border:1.5px solid var(--line);background:#fff;border-radius:50px;padding:6px 12px;font-weight:800;cursor:pointer;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wd{text-align:center;font-size:11px;font-weight:800;color:var(--sec);padding:2px 0}
  .cal-cell{height:46px;border-radius:10px;background:#f6f2ea;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:2px;cursor:pointer}
  .cal-cell .d{font-size:12px;font-weight:800;color:var(--ink)}
  .cal-cell .r{font-size:9px;color:var(--ink2);margin-top:1px}
  .cal-cell.lv0{background:#f6f2ea}
  .cal-cell.lv1{background:#cdeee9}.cal-cell.lv2{background:#9dded6}.cal-cell.lv3{background:#5fc6ba}.cal-cell.lv4{background:var(--primary);color:#fff}
  .cal-cell.lv4 .d,.cal-cell.lv4 .r{color:#fff}
  .cal-cell.today .d{border:2px solid var(--yellow);border-radius:50%;width:20px;height:20px;line-height:16px;display:inline-block}
  .cal-cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
  .cal-cell.blank{background:transparent;cursor:default}

  /* 排行榜 */
  .rank-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .rank-row .nm{flex:1;min-width:0}
  .rank-row .bar{height:9px;background:var(--primary-soft);border-radius:50px;overflow:hidden;margin-top:4px}
  .rank-row .bar i{display:block;height:100%;background:var(--primary);border-radius:50px}
  .rank-row .v{font-weight:800;font-size:13px;white-space:nowrap;text-align:right}
  .rank-no{width:20px;flex:0 0 20px;text-align:center;font-weight:900;font-size:13px;color:var(--sec)}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line)}
  .tbl th{font-weight:800;background:var(--primary);color:#fff}
  .tbl tr.gone td{color:var(--sec)}
  @media(min-width:480px){ .tbl th:first-child,.tbl td:first-child{border-radius:0} }
  .sale-del{display:inline-block;color:#e35d6a;font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(227,93,106,0.1);cursor:pointer;white-space:nowrap}
  .sale-del:active{opacity:.7}
  .sum-row td{background:#fbf9f4;font-weight:800}
  .chk-ok{color:var(--success);font-weight:800}
  .chk-warn{color:var(--orange);font-weight:800}

  .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sec);font-weight:600;margin-top:8px;flex-wrap:wrap}
  .legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
  .chip-list{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .inline-btn{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary-d);border:1.5px solid #cfeae6;border-radius:50px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}
  /* 居中自动消失小弹窗：固定定位、不占布局、1 秒后淡出 */
  .toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(-6px);background:rgba(40,32,24,.92);color:#fff;font-size:13.5px;font-weight:700;padding:9px 16px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .15s ease, transform .15s ease;z-index:200;max-width:82%;text-align:center;letter-spacing:.2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 存储/同步异常警示条：账目没保存成功时必须让人一眼看见，且不可自动消失 */
  .alertbar{margin:10px 14px 0;background:#fff1f0;border:2px solid var(--error);border-radius:14px;padding:11px 13px;font-size:12.5px;font-weight:700;color:#8f2b26;line-height:1.55;flex:0 0 auto}
  .alertbar.info{background:#fff8e6;border-color:var(--warning);color:#6b5210}
  .alertbar b{font-weight:900}
  .alertbar .dismiss{display:inline-block;margin-top:6px;background:#fff;border:1.5px solid currentColor;border-radius:50px;padding:4px 12px;font-size:12px;font-weight:800;color:inherit;cursor:pointer}
  .badge-bad{background:var(--error);color:#fff;border-radius:50px;padding:2px 9px;font-size:10px;font-weight:800;display:inline-block}
  .stk-bad{color:var(--error)}
  .move-plus{color:var(--success);font-weight:800}
  .move-minus{color:var(--orange);font-weight:800}
</style>
</head>
<body>
<div class="phone">
  <div class="navbar">
    <div>
      <div class="t" id="navTitle">夜市娃娃小岛</div>
      <div class="s" id="navSub">摆摊记账 · 补货提醒</div>
    </div>
    <div class="badge" id="navBadge">预览 v2</div>
  </div>
  <div id="alertBar" class="alertbar" style="display:none"></div>
  <div class="scroll" id="page"></div>
  <button class="fab" id="fab" style="display:none" onclick="quickOpen()">⚡ 记一笔</button>
  <div class="tabbar" id="tabbar"></div>
</div>

<script>
/* ============ 全局报错兜底：任何错误都显示在页面上，不再白屏 ============ */
function showFatal(msg){
  var el=document.getElementById('page'); if(!el) return;
  el.innerHTML='<div class="card" style="border:2px solid #c92a2a"><div class="card-h" style="color:#c92a2a">⚠ 页面出错</div><div class="meta" style="white-space:pre-wrap;word-break:break-all">'+String(msg).replace(/</g,'&lt;')+'</div><div class="meta">请刷新重试；如仍不行，把这段红字发我即可。</div></div>';
}
window.addEventListener('error', function(e){ showFatal((e&&e.message)||(e&&e.error)||'未知错误'); });

/* ============ 数据存储：localStorage 存元数据 + IndexedDB 存商品图片 ============
   v2 修复（重要）：旧版 save() 是「先写图片到 IDB，成功了才写元数据到 localStorage」。
   一旦图片写 IDB 失败（隐私模式 / IDB 被拦 / 配额满），元数据那一步就永远不会执行；
   兜底分支又把「含图片的整份数据」塞 localStorage，通常因超配额再次失败并被静默吞掉。
   结果：卖出后当次页面库存看着减了，一刷新库存又回来了 —— 看起来像「库存没减」。
   现在改为：①元数据（库存/流水）先无条件独立落盘 ②图片再单独走 IDB，图片失败绝不影响记账。 */
const KEY='ye_shi_wa_wa_web';
const IDB_NAME='yeshi_wa_wa';
const IDB_STORE='product_imgs';

/* 通用工具（uid/日期）— seed 与日历、记一笔等地方都用到，必须保留 */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function z(n){return ('0'+n).slice(-2);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function daysAgoISO(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
/* 与「今天」相差的日历天数（本地时区）：今天 0、昨天 1、前天 2。
   为什么不直接用 (now - new Date(iso)) 除以一天？因为 'YYYY-MM-DD' 在 JS 里被当成 UTC 零点，
   东八区算出来会凭空多出 8 小时 —— 下午三点时「前天」会被算成 3 天，滞销提示就会说错。 */
function dayDiff(iso){
  const s=String(iso||'').slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;
  const y=+s.slice(0,4),m=+s.slice(5,7),d=+s.slice(8,10);
  if(!y||!m||!d)return null;
  const that=new Date(y,m-1,d);
  const now=new Date();now.setHours(0,0,0,0);
  const n=Math.round((now-that)/86400000);
  return isNaN(n)?null:n;
}

var _idb=null, _idbFailed=false;

function openImgDB(){
  return new Promise(function(res,rej){
    if(_idbFailed) return rej(new Error('idb-disabled'));
    if(_idb) return res(_idb);
    if(typeof indexedDB==='undefined'){ _idbFailed=true; return rej(new Error('no-idb')); }
    try{
      var r=indexedDB.open(IDB_NAME,1);
      r.onupgradeneeded=function(){
        if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE);
      };
      r.onsuccess=function(){ _idb=r.result; res(_idb); };
      r.onerror=function(){ _idbFailed=true; rej(r.error||new Error('idb-open-fail')); };
      r.onblocked=function(){ _idbFailed=true; rej(new Error('idb-blocked')); };
    }catch(e){ _idbFailed=true; rej(e); }
  });
}
function idbAll(){
  return openImgDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(IDB_STORE,'readonly');
        var s=tx.objectStore(IDB_STORE);
        var k=s.getAllKeys(), v=s.getAll();
        k.onsuccess=function(){ v.onsuccess=function(){ res({keys:k.result||[], values:v.result||[]}); }; };
        k.onerror=function(){ rej(k.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbSet(key,val){
  return openImgDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(val,key);
        tx.oncomplete=res; tx.onerror=function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbDel(key){
  return openImgDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete=res; tx.onerror=function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}

/* ---------- 元数据落盘：唯一写入口，写完立刻回读校验 ---------- */
function slimOf(db){
  var o=Object.assign({},db);
  o.products=(db.products||[]).map(function(p){return Object.assign({},p,{image:''});});
  return o;
}
/* 指纹 = 全部商品的「id:库存」+ 流水条数 + 版本号。写入前后各算一次，必须一模一样 */
function stockFingerprint(db){
  if(!db||!Array.isArray(db.products))return 'none';
  return db.products.map(function(p){return p.id+':'+(p.stock==null?'?':p.stock);}).join('|')
    +'#'+((db.tx||[]).length)+'@'+(db.rev||0);
}
function _persistMeta(){
  DB.rev=(DB.rev||0)+1;
  DB.savedAt=Date.now();
  localStorage.setItem(KEY, JSON.stringify(slimOf(DB)));
  return true;
}
function _quotaToast(){
  try{ toast('本地存储已满，请到「设置」导出备份后清理'); }catch(_){}
}
/* ---------- 存储健康状态：出问题就在顶部挂一条不会消失的红条 ---------- */
var _store={ok:true,msg:''};
function setStoreBad(msg){
  _store.ok=false;
  if(msg) _store.msg=Array.isArray(msg)?msg.join('；'):String(msg);
  try{ renderAlertBar(); }catch(_){}
}
function renderAlertBar(){
  var el=document.getElementById('alertBar'); if(!el)return;
  var items=[];
  if(!_store.ok){
    items.push('🚨 <b>账目没有保存成功</b>　'+esc(_store.msg||'本地存储不可用')
      +'<br>现在记的卖出/进货，刷新页面后会丢失。请先到「设置 → 数据备份」导出一次，再换一个正常浏览器窗口打开。');
  }
  if(_conflict.pending){
    items.push('🔄 <b>另一个窗口/标签也改了数据</b>　已自动同步为最新，请确认库存数字后继续。'
      +'<br><span class="dismiss" onclick="dismissConflict()">知道了</span>');
  }
  if(!items.length){ el.style.display='none'; el.innerHTML=''; return; }
  el.style.display='block';
  el.className='alertbar'+(items.length===1&&_conflict.pending&&_store.ok?' info':'');
  el.innerHTML=items.join('<div style="height:7px"></div>');
}
function dismissConflict(){ _conflict.pending=false; renderAlertBar(); }
function storageProbe(){
  try{
    var k='__yeshi_probe__';
    localStorage.setItem(k,'1');
    var v=localStorage.getItem(k);
    localStorage.removeItem(k);
    return v==='1';
  }catch(e){ return false; }
}
function _loadImagesFromIDB(){
  openImgDB().then(function(){ return idbAll(); })
  .then(function(r){
    var map={};
    for(var i=0;i<r.keys.length;i++) map[r.keys[i]]=r.values[i];
    var mig=[];
    var filled=false;
    DB.products.forEach(function(p){
      if(!p.image && map[p.id]){ p.image=map[p.id]; filled=true; }
      if(p.image && /^data:/.test(p.image)) mig.push(idbSet(p.id, p.image));
    });
    if(mig.length){
      Promise.all(mig).catch(function(){ /* 迁移失败不影响元数据 */ });
    }
    if(filled){ try{ render(); }catch(_){ } }
  })
  .catch(function(){
    _idbFailed=true;
    // 兜底：图片另存一份独立键，绝不与账目混写（账目优先，图片存不下就算了）
    try{
      var imgs={};
      DB.products.forEach(function(p){ if(p.image) imgs[p.id]=p.image; });
      if(Object.keys(imgs).length) localStorage.setItem(KEY+'_imgs', JSON.stringify(imgs));
    }catch(e){}
    try{ loadImagesFromLocal(); }catch(e){}
  });
}
function loadImagesFromLocal(){
  var raw=null;
  try{ raw=localStorage.getItem(KEY+'_imgs'); }catch(e){}
  if(!raw)return;
  var imgs;try{ imgs=JSON.parse(raw); }catch(e){return;}
  var filled=false;
  DB.products.forEach(function(p){ if(!p.image&&imgs[p.id]){ p.image=imgs[p.id]; filled=true; } });
  if(filled){ try{ render(); }catch(_){ } }
}
function ensureDefaults(){
  if(!DB.settings) DB.settings={restockDays:7,periodDays:30,defaultSafety:10,catTemplates:[],slowDays:14,slowMode:'idle',slowIdleDays:21,slowThreshold:0.2};
  if(DB.settings.defaultSafety==null) DB.settings.defaultSafety=10;
  if(!Array.isArray(DB.settings.catTemplates)) DB.settings.catTemplates=[];
  if(DB.settings.slowDays==null) DB.settings.slowDays=14;
  if(DB.settings.slowMode==null) DB.settings.slowMode='idle';
  if(DB.settings.slowIdleDays==null) DB.settings.slowIdleDays=21;
  if(DB.settings.slowThreshold==null) DB.settings.slowThreshold=0.2;
  if(!Array.isArray(DB.tx)) DB.tx=[];
  if(!Array.isArray(DB.products)) DB.products=[];
}
function load(){
  var r=null;
  try{ r=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(r && r.products) DB=r;
  ensureDefaults();
  if(!DB.seeded && !DB.products.length){
    var s=seed(); DB.products=s.products; DB.tx=s.tx; DB.seeded=true;
  }
  migrateStockBase(DB);          // 老数据补齐「期初库存」，让库存恒等式当场成立
  if(!storageProbe()) setStoreBad('这个浏览器禁用了本地存储（可能是隐私/无痕模式）');
  else {
    try{ _persistMeta(); }
    catch(e){ setStoreBad((e&&e.name==='QuotaExceededError')?'本地存储已满':((e&&e.message)||'写入被拒绝')); }
  }
  _loadImagesFromIDB();
  return DB;
}
function save(){
  /* ① 元数据先无条件落盘 —— 库存和流水一定保存（这份不含图片，体积很小） */
  try{
    _persistMeta();
  }catch(e){
    if(e && (e.name==='QuotaExceededError' || e.code===22)){ _quotaToast(); setStoreBad('本地存储已满（QuotaExceeded）'); }
    else setStoreBad((e&&e.message)||String(e));
  }
  /* ② 回读校验：确认真正写进存储的库存，就是我刚算出来的那份；正常了就把红条撤掉 */
  try{
    var back=JSON.parse(localStorage.getItem(KEY)||'null');
    if(stockFingerprint(back)!==stockFingerprint(DB)){
      setStoreBad('写入后回读校验不一致（可能被其他窗口覆盖或存储异常）');
    }else if(!_store.ok){
      _store.ok=true; _store.msg='';
      try{ renderAlertBar(); }catch(_){}
    }
  }catch(e){ setStoreBad('写入后无法回读校验：'+((e&&e.message)||e)); }
  /* ③ 图片另行处理，任何失败都不会影响第①步已保存的账目。
        注意：这里绝不把图片混进账目那一份存储，避免超配额连累库存。 */
  if(_idbFailed){
    try{
      var imgs={};
      DB.products.forEach(function(p){ if(p.image) imgs[p.id]=p.image; });
      if(Object.keys(imgs).length) localStorage.setItem(KEY+'_imgs', JSON.stringify(imgs));
    }catch(e){}
    return;
  }
  var tasks=[];
  DB.products.forEach(function(p){
    if(p.image && /^data:/.test(p.image)) tasks.push(idbSet(p.id, p.image));
    else tasks.push(idbDel(p.id));
  });
  Promise.all(tasks).catch(function(){ /* 图片失败无所谓，账已在①保存 */ });
}
var DB={products:[],tx:[],settings:{restockDays:7,periodDays:30,defaultSafety:10,catTemplates:['三丽鸥','自嘲熊','线条小狗','玉桂狗','星之卡比','盲盒','卡通','钥匙扣','其他'],slowDays:14,slowMode:'idle',slowIdleDays:21,slowThreshold:0.2}};

/* ============================================================
   库存自证体系 —— 库存必须能「算出来、对得上、查得到」
   ------------------------------------------------------------
   恒等式：  当前库存 = 期初库存 + Σ进货 − Σ卖出 + Σ盘点调整
   规则：
     ① 任何改动库存的动作，都必须同时写一笔流水（sale/purchase/adjust）；
     ② 因此上面这个等式在任何时刻都必须成立，stockDrift() 正常恒为 0；
     ③ 若不为 0，说明数据被外部改过（或存储出过问题），页面会标红并给校正入口；
     ④ 手工把库存改成某个数时，差额会自动记成一笔 adjust，等式依然成立（有据可查）。
   ============================================================ */
function txDelta(t){
  if(!t) return 0;
  if(t.type==='sale') return -Number(t.qty||0);   // 卖出：减
  return Number(t.qty||0);                        // 进货：加；调整：qty 自带正负号
}
function stockFromHistory(p,db){
  var v=Number(p.baseStock||0);
  (db.tx||[]).forEach(function(t){ if(t.productId===p.id) v+=txDelta(t); });
  return v;
}
function stockDrift(p,db){ return Number(p.stock||0)-stockFromHistory(p,db); }
function isStockBad(p,db){ return Number(p.stock||0)<0 || stockDrift(p,db)!==0; }
function badStockList(db){ return (db.products||[]).filter(function(p){return isStockBad(p,db);}); }
function migrateStockBase(db){
  var changed=false;
  (db.products||[]).forEach(function(p){
    if(p.baseStock!=null) return;
    var sum=0;
    (db.tx||[]).forEach(function(t){ if(t.productId===p.id) sum+=txDelta(t); });
    p.baseStock=Number(p.stock||0)-sum;      // 反推期初库存，让等式当场成立
    changed=true;
  });
  if(!db.stockBaseMigrated){ db.stockBaseMigrated=true; changed=true; }
  return changed;
}
/* 唯一允许改库存的函数：改多少，就自动配一笔流水 */
function pushMove(p,type,qty,note,extra){
  var t=Object.assign({id:uid(),productId:p.id,type:type,qty:Number(qty||0),date:todayISO(),note:note||''},extra||{});
  DB.tx.push(t);
  p.stock=Number(p.stock||0)+txDelta(t);
  return t;
}
/* 把库存直接设成某个数（手动改库存 / 盘点校正）：差额自动记成 adjust */
function setStockTo(p,newStock,note){
  var delta=Number(newStock||0)-Number(p.stock||0);
  if(delta===0) return null;
  return pushMove(p,'adjust',delta,note||'库存校正');
}
/* 重设期初：把 baseStock 调成「账面 − Σ流水」，让恒等式当场归零。
   为什么必须这么做？因为「偏差」是这套系统的不变量：
   账面和推算会随每一笔流水同步移动，所以偏差不可能靠"再记一笔调整"修掉，
   只能重设期初。盘点时用实物数定音，然后重设期初，是最干净的做法。 */
function rebaseline(p,db){
  db=db||DB;
  var sum=0;
  (db.tx||[]).forEach(function(t){ if(t.productId===p.id) sum+=txDelta(t); });
  p.baseStock=Number(p.stock||0)-sum;
  return p.baseStock;
}
function rebaselineAll(db){
  db=db||DB;
  var n=0;
  (db.products||[]).forEach(function(p){ if(stockDrift(p,db)!==0){ rebaseline(p,db); n++; } });
  return n;
}

/* ---------- 每日自动备份（只备份账目，不含图片，几十 KB） ---------- */
var SNAP_PREFIX='ye_shi_wa_wa_snap_';
function snapKey(d){ return SNAP_PREFIX+d; }
function snapList(){
  var arr=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(SNAP_PREFIX)===0) arr.push(k.slice(SNAP_PREFIX.length));
    }
  }catch(e){}
  return arr.sort().reverse();
}
function snapshotDaily(){
  try{
    var today=todayISO();
    if(localStorage.getItem(snapKey(today))) return;
    if(!DB.products||!DB.products.length) return;
    localStorage.setItem(snapKey(today), JSON.stringify(slimOf(DB)));
    snapList().slice(7).forEach(function(d){ try{ localStorage.removeItem(snapKey(d)); }catch(e){} });
  }catch(e){ /* 备份失败绝不连累记账 */ }
}
function restoreSnapshot(d){
  var raw=null;
  try{ raw=localStorage.getItem(snapKey(d)); }catch(e){}
  if(!raw){ toast('找不到该备份'); return; }
  if(!confirm('用「'+d+'」的备份覆盖当前数据？\n（当前数据会先另存一份「恢复前」，可再退回来）')) return;
  var data;try{ data=JSON.parse(raw); }catch(e){ toast('备份内容损坏'); return; }
  try{ localStorage.setItem(snapKey('restore-before-'+Date.now()), JSON.stringify(slimOf(DB))); }catch(e){}
  var imgMap={};DB.products.forEach(function(p){ imgMap[p.id]=p.image; });
  DB=data;ensureDefaults();
  DB.products.forEach(function(p){ if(!p.image&&imgMap[p.id]) p.image=imgMap[p.id]; });
  migrateStockBase(DB);
  save(); toast('已恢复到 '+d); render();
}

function snapInfo(d){
  try{
    var raw=localStorage.getItem(snapKey(d));
    if(!raw) return '（读不到）';
    var o=JSON.parse(raw);
    var n=(o.products||[]).length,m=(o.tx||[]).length;
    var book=(o.products||[]).reduce(function(s,p){return s+Number(p.stock||0);},0);
    return n+' 个商品 · '+m+' 笔流水 · 库存合计 '+book;
  }catch(e){ return '（读取失败）'; }
}
function toggleBackups(){ showBackups=!showBackups; renderSettings(); }
/* 一键自检：存储能不能写 + 存储里那份和页面算的是不是同一份 + 库存恒等式是否成立 */
function selfCheck(){
  var msgs=[];
  if(!storageProbe()) msgs.push('本地存储不可写');
  try{
    var back=JSON.parse(localStorage.getItem(KEY)||'null');
    if(stockFingerprint(back)!==stockFingerprint(DB)) msgs.push('存储里的库存与页面不一致');
  }catch(e){ msgs.push('存储内容读不出来'); }
  var bad=badStockList(DB);
  if(bad.length) msgs.push(bad.length+' 个商品库存与流水对不上：'+bad.slice(0,3).map(function(p){return p.name;}).join('、'));
  if(!msgs.length){
    if(!_store.ok){ _store.ok=true; _store.msg=''; renderAlertBar(); }
    toast('自检通过 ✅ '+DB.products.length+' 个商品的库存与流水完全一致');
  }else{
    setStoreBad(msgs);
    toast('自检发现问题：'+msgs[0]);
  }
  renderSettings();
}

/* ---------- 多窗口/多标签冲突：不加这道防线，两边会互相覆盖，库存必错 ---------- */
var _conflict={pending:false,at:0};
function reloadFromStorage(){
  var r=null;
  try{ r=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!r||!Array.isArray(r.products)) return false;
  var imgMap={};DB.products.forEach(function(p){ imgMap[p.id]=p.image; });
  r.products.forEach(function(p){ if(!p.image&&imgMap[p.id]) p.image=imgMap[p.id]; });
  var reopen=window._tx?{pid:window._tx.pid,type:window._tx.type,label:window._tx.label}:null;
  DB=r;ensureDefaults();migrateStockBase(DB);
  _conflict.pending=true; _conflict.at=Date.now();
  closeSheet();
  try{ render(); }catch(_){ }
  renderAlertBar();
  toast('已同步另一个窗口的改动');
  if(reopen){
    var p=DB.products.find(function(x){return x.id===reopen.pid;});
    /* 等历史真的退回去之后再重开这一层，避免 history.go 和新的 pushState 抢跑 */
    if(p) setTimeout(function(){ openTxStep(reopen.type,p.id,reopen.label||''); },160);
  }
  return true;
}
function bindStorageSync(){
  window.addEventListener('storage',function(e){
    if(!e||e.key!==KEY) return;
    var incoming=null;
    try{ incoming=JSON.parse(e.newValue||'null'); }catch(_){}
    if(!incoming){ _conflict.pending=true; renderAlertBar(); return; }
    if((incoming.savedAt||0)!==(DB.savedAt||0)) reloadFromStorage();
  });
}

/* 图片压缩：手机拍的照片动辄好几M，直接转 base64 存 localStorage 会卡死甚至超容量。
   这里缩到最长边 800px、JPEG 0.72，单张一般 50~120KB，既不卡也存得下。 */
function compressImage(file,cb,maxDim,quality){
  maxDim=maxDim||800;quality=quality||0.72;
  const r=new FileReader();
  r.onload=function(){
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;
      if(w>h){if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}}
      else{if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}}
      try{
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',quality));
      }catch(e){cb(r.result);}
    };
    img.onerror=function(){cb(r.result);};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* ============ 示例数据（与小程序一致） ============ */
function seed(){
  const base=[
    {name:'库洛米挂件',cat:'三丽鸥',cost:5,price:15,stock:12,safe:20,rate:2.0},
    {name:'玲娜贝儿挂件',cat:'三丽鸥',cost:8,price:20,stock:3,safe:15,rate:3.0},
    {name:'三丽鸥盲盒',cat:'盲盒',cost:12,price:30,stock:40,safe:10,rate:0.2},
    {name:'星之卡比挂件',cat:'卡通',cost:4,price:12,stock:0,safe:15,rate:1.5},
    {name:'玉桂狗钥匙扣',cat:'钥匙扣',cost:3,price:10,stock:25,safe:12,rate:0.8},
    {name:'屁桃君挂件',cat:'卡通',cost:6,price:18,stock:5,safe:10,rate:1.0},
    {name:'挂饰 新年平安果 kt',cat:'三丽鸥',cost:12.1,price:35,stock:0,safe:10,rate:2.5}
  ];
  const products=base.map(b=>({id:uid(),name:b.name,cat:b.cat||'',cost:b.cost,price:b.price,stock:b.stock,safetyStock:b.safe,unit:'个',image:'',createdAt:Date.now()}));
  const tx=[];
  base.forEach((b,i)=>{const pid=products[i].id;for(let d=0;d<30;d++){const qty=Math.max(0,Math.round(b.rate+(Math.sin(d*1.3+i)*0.6)));if(qty>0)tx.push({id:uid(),productId:pid,type:'sale',qty:qty,date:daysAgoISO(d),note:''});}});
  return {products,tx};
}

/* ============ 统计算法 ============ */
/* analytics：近 periodDays 天的口径 —— 只用于「补货建议 / 日均」，不要用于排行榜 */
function analytics(p,db){
  const settings=db.settings,now=Date.now(),pm=settings.periodDays*86400000;
  const sales=db.tx.filter(t=>t.productId===p.id&&t.type==='sale'&&(now-new Date(t.date).getTime())<=pm);
  const totalSold=sales.reduce((s,t)=>s+t.qty,0);
  const avgDaily=totalSold/settings.periodDays;
  const coverDays=avgDaily>0?p.stock/avgDaily:Infinity;
  const need=Math.max(0,Math.ceil(avgDaily*settings.restockDays)-p.stock);
  const status=p.stock<=0?'out':(p.stock<p.safetyStock?'low':'ok');
  const st=slowStat(p,db);
  return {totalSold,avgDaily,coverDays,need,status,slow:st.slow,never:st.never,idleDays:st.idleDays};
}
/* 「还能卖几天」怎么显示：缺货就是 0 天 —— 没货了却写「还能卖 ∞ 天」是自相矛盾的；
   有货但近期一件没卖，才是真的 ∞（照这个速度卖不完）。 */
function coverText(stock,coverDays){
  if(Number(stock||0)<=0) return '0';
  if(coverDays==null||!isFinite(coverDays)) return '∞';
  return String(Math.round(coverDays));
}
/* 滞销判定。两种口径，共同前提是「有库存」且「上架已满 slowDays 天」（刚上的新货不算）：
     idle（默认）＝ 距上次卖出已超过 slowIdleDays 天；从未卖出过的一律算（这才是最该砍的死货）
     abs          ＝ 近 periodDays 的日均销量低于 slowThreshold
   为什么默认用 idle：日均销量受统计窗口影响极大，营业额不大时（比如设了 7 天窗口）
   几乎所有商品都会被判成滞销，等于这个指标没用；「多久没卖出」与窗口长短无关，
   而且直接对应你真正要做的决定 —— 这件还要不要再进货。 */
function slowStat(p,db){
  const s=db.settings||{}, now=Date.now();
  const ageDays=p.createdAt?(now-p.createdAt)/86400000:999;
  const slowDays=s.slowDays!=null?s.slowDays:14;
  let idleDays=null;                                  /* 距上次卖出天数；null = 从未卖出 */
  for(let i=0;i<db.tx.length;i++){
    const t=db.tx[i];
    if(t.productId!==p.id||t.type!=='sale')continue;
    const d=dayDiff(t.date);                          /* 按日历天算，避免时区把天数算多一天 */
    if(d===null)continue;
    if(d<0)d=0;                                       /* 万一流水日期异常跑到未来，按「今天」处理 */
    if(idleDays===null||d<idleDays)idleDays=d;
  }
  const never=(idleDays===null);
  const eligible=(Number(p.stock||0)>0)&&ageDays>=slowDays;
  let slow=false;
  if(eligible){
    if((s.slowMode||'idle')==='abs'){
      const pd=s.periodDays||30, pm=pd*86400000;
      let sold=0;
      for(let i=0;i<db.tx.length;i++){
        const t=db.tx[i];
        if(t.productId===p.id&&t.type==='sale'&&(now-new Date(t.date).getTime())<=pm)sold+=t.qty;
      }
      slow=(sold/pd)<(s.slowThreshold!=null?s.slowThreshold:0.2);
    }else{
      const lim=s.slowIdleDays!=null?s.slowIdleDays:21;
      slow=never||(idleDays>lim);
    }
  }
  return {slow:slow,never:never,idleDays:idleDays,eligible:eligible};
}
/* 排序用：从未卖出的排最前（最该处理），其余按「多久没卖出」降序 */
function idleSortKey(d){ return d==null?1e9:d; }
function idleText(d){ return d==null?'上架至今一件没卖出':('距上次卖出已 '+d+' 天'); }
/* allTime：累计（全部时间）口径 —— 排行榜 / 商品页 / 对账 统一用它，保证两个页面数字一致 */
function allTime(p,db){
  let qty=0,rev=0,cost=0,last='';
  for(let i=0;i<db.tx.length;i++){
    const t=db.tx[i];
    if(t.productId!==p.id||t.type!=='sale')continue;
    qty+=t.qty;
    rev+=(t.amount!=null?t.amount:p.price*t.qty);
    cost+=p.cost*t.qty;
    if(t.date>last)last=t.date;
  }
  return {qty:qty,rev:Math.round(rev),profit:Math.round(rev-cost),last:last};
}
function todaySales(db){const tod=todayISO();let qty=0,rev=0,cost=0;db.tx.forEach(x=>{if(x.type==='sale'&&x.date===tod){qty+=x.qty;const p=db.products.find(y=>y.id===x.productId);const amt=x.amount!=null?x.amount:(p?p.price*x.qty:0);rev+=amt;cost+=(p?p.cost*x.qty:0);}});return{qty,rev,cost,profit:rev-cost};}
function monthSales(db){const m=todayISO().slice(0,7);let qty=0,rev=0,cost=0;db.tx.forEach(x=>{if(x.type==='sale'&&x.date.slice(0,7)===m){qty+=x.qty;const p=db.products.find(y=>y.id===x.productId);const amt=x.amount!=null?x.amount:(p?p.price*x.qty:0);rev+=amt;cost+=(p?p.cost*x.qty:0);}});return{qty,rev,cost,profit:rev-cost};}

/* ============ 业绩页：全部改「累计」口径 + 对账 ============ */
function renderPerformance(){
  const db=DB;const t=todaySales(db),m=monthSales(db);
  const names={};db.products.forEach(p=>names[p.id]=p.name);
  /* 唯一数据源：全部销售流水。排行、记录、对账全部由它派生，避免口径打架 */
  const allSales=db.tx.map((x,i)=>({x:x,i:i})).filter(o=>o.x.type==='sale')
    .sort((a,b)=>{ if(a.x.date!==b.x.date) return a.x.date<b.x.date?1:-1; return b.i-a.i; })
    .map(o=>{
      const x=o.x;const p=db.products.find(y=>y.id===x.productId);
      const mny=Math.round(x.amount!=null?x.amount:((p?p.price:0)*x.qty));
      return {id:x.id,pid:x.productId,name:names[x.productId]||'已删除',qty:x.qty,date:x.date,note:x.note,money:mny,gone:!p};
    });
  const sumQty=allSales.reduce((s,r)=>s+r.qty,0);
  const sumMoney=allSales.reduce((s,r)=>s+r.money,0);

  /* 流水记录表用：全部类型（售出/进货/调整）。与上面的「销售」口径分开计算，互不干扰 */
  const allMoves=db.tx.map((x,i)=>({x:x,i:i}))
    .sort((a,b)=>{ if(a.x.date!==b.x.date) return a.x.date<b.x.date?1:-1; return b.i-a.i; })
    .map(o=>{
      const x=o.x;const p=db.products.find(y=>y.id===x.productId);
      const mny=x.type==='adjust'?0:Math.round(x.amount!=null?x.amount:((p?p.price:0)*x.qty));
      return {id:x.id,pid:x.productId,name:names[x.productId]||'已删除',type:x.type,qty:Number(x.qty||0),
        delta:txDelta(x),date:x.date,note:x.note,money:mny,gone:!p};
    });

  /* 库存自证：账面库存合计 vs 按流水推算合计，两者必须相等 */
  const bookTotal=db.products.reduce((s,p)=>s+Number(p.stock||0),0);
  const histTotal=db.products.reduce((s,p)=>s+stockFromHistory(p,db),0);
  const stockBadList=db.products.filter(p=>isStockBad(p,db));

  /* 排行：现存商品的全部累计 */
  const active=db.products.map(p=>({p:p,at:allTime(p,db),a:analytics(p,db)})).filter(r=>r.at.qty>0)
    .sort((x,y)=>y.at.rev-x.at.rev||y.at.qty-x.at.qty);
  const maxRev=active.length?active[0].at.rev:1;
  const rankQty=active.reduce((s,r)=>s+r.at.qty,0);
  const rankMoney=active.reduce((s,r)=>s+r.at.rev,0);
  /* 对账：记录里属于「已删除商品」的旧流水 */
  const goneQty=allSales.filter(r=>r.gone).reduce((s,r)=>s+r.qty,0);
  const goneMoney=allSales.filter(r=>r.gone).reduce((s,r)=>s+r.money,0);
  const gapQty=rankQty+goneQty-sumQty;       // 正常应为 0
  const gapMoney=rankMoney+goneMoney-sumMoney;

  /* 售出记录：时间段筛选 */
  const tod=todayISO();
  const weekFrom=daysAgoISO(6);
  const mon=tod.slice(0,7);
  const rangeFns={
    all:()=>true,
    today:r=>r.date===tod,
    '7':r=>r.date>=weekFrom,
    month:r=>r.date.slice(0,7)===mon
  };
  const rangeLabel={all:'全部',today:'今天','7':'近7天',month:'本月'};
  const typeLabel={all:'全部类型',sale:'卖出',purchase:'进货',adjust:'库存调整'};
  const typeCount={all:0,sale:0,purchase:0,adjust:0};
  const inRange=allMoves.filter(rangeFns[recRange]||rangeFns.all);
  inRange.forEach(r=>{typeCount[r.type]=(typeCount[r.type]||0)+1;});
  const shown=inRange.filter(r=>recType==='all'||r.type===recType);
  const view=salesExpanded?shown:shown.slice(0,salesLimit);
  const rangeQty=shown.filter(r=>r.type==='sale').reduce((s,r)=>s+r.qty,0);
  const rangeMoney=shown.filter(r=>r.type==='sale').reduce((s,r)=>s+r.money,0);
  const rangeIn=shown.filter(r=>r.type==='purchase').reduce((s,r)=>s+r.qty,0);
  const rangeAdj=shown.filter(r=>r.type==='adjust').reduce((s,r)=>s+r.delta,0);

  /* 日历（保持不变，按所选月份统计营业额） */
  const y=calState.y,mth=calState.m,prefix=y+'-'+z(mth+1)+'-';
  const revByDay={};db.tx.forEach(x=>{if(x.type==='sale'&&x.date.indexOf(prefix)===0){const d=parseInt(x.date.slice(8,10),10);const p=db.products.find(q=>q.id===x.productId);revByDay[d]=(revByDay[d]||0)+(x.amount!=null?x.amount:((p?p.price:0)*x.qty));}});
  const firstWd=new Date(y,mth,1).getDay(),daysInMonth=new Date(y,mth+1,0).getDate(),todayI=todayISO();
  let total=0,activeDays=0,best=0;for(let d=1;d<=daysInMonth;d++){const r=Math.round(revByDay[d]||0);total+=r;if(r>0)activeDays++;if(r>best)best=r;}

  calHtml+=`</div>

  let dayHtml='';

  }

  /* 对账卡片 */

    <div class="row" style="margin-bottom:6px"><div style="flex:1"><div class="name" style="font-size:13px">售出记录合计（全部流水）</div><div class="meta">含已删除商品</div></div><div style="font-weight:800;text-align:right">${sumQty} 件<br>${money(sumMoney)}</div></div>
    ${goneQty?`<div class="row" style="margin-bottom:6px"><div style="flex:1"><div class="name" style="font-size:13px">其中：已删除商品的旧流水</div><div class="meta">这些商品已不在商品页，所以只出现在记录里</div></div><div style="font-weight:800;text-align:right">${goneQty} 件<br>${money(goneMoney)}</div></div>`:''}
    <div class="row" style="margin-bottom:6px;${stockBadList.length?'border-color:var(--error)':''}"><div style="flex:1"><div class="name" style="font-size:13px">库存对账（账面 vs 按流水推算）</div><div class="meta">期初 + 进货 − 卖出 + 调整 必须 = 账面库存</div></div><div style="font-weight:800;text-align:right">${stockBadList.length?('<span class="stk-bad">⚠ '+stockBadList.length+' 项异常</span>'):'✅ 全部一致'}<br><span style="font-size:11px;color:var(--sec)">账面 ${bookTotal} / 推算 ${histTotal}</span></div></div>
    ${stockBadList.length?'<button class="btn btn-danger btn-xs" style="margin-top:8px" onclick="openStocktake()">去盘点校正</button>':''}

    <div class="stat" style="background:var(--orange)"><div class="n">${money(t.rev)}</div><div class="l">今日营业额</div></div>

  </div>
  ${dayHtml}
  <div class="section-title">🏆 销售排行（累计 · 全部时间）</div>
  <div class="card">${active.length?active.map((r,i)=>`
    <div class="rank-row">
      <div class="rank-no">${i+1}</div>
      <div class="thumb" style="width:40px;height:40px;flex:0 0 40px" onclick="preview('${r.p.image}')">${r.p.image?`<img src="${r.p.image}">`:'🧸'}</div>
      <div class="nm"><div class="name" style="font-size:13px">${esc(r.p.name)} ${r.a.slow?'<span class="tag t-slow">滞销</span>':''}</div><div class="bar"><i style="width:${Math.max(4,Math.round(r.at.rev/maxRev*100))}%"></i></div></div>

  </div>
  ${chk}
  <div class="section-title">🧾 流水记录（卖出 / 进货 / 库存调整）</div>
  <div class="filter-card">
    <div class="chipbar" style="padding-top:0">
      ${['all','today','7','month'].map(k=>`<span class="chip ${recRange===k?'on':''}" onclick="setRecRange('${k}')">${rangeLabel[k]}</span>`).join('')}
    </div>
    <label class="label">按类型看（进货流水用来核对库存，别只看卖出）</label>
    <div class="chipbar" style="padding-top:0;padding-bottom:8px">
      ${['sale','purchase','adjust','all'].map(k=>`<span class="chip ${recType===k?'on':''}" onclick="setRecType('${k}')">${typeLabel[k]} ${typeCount[k]||0}</span>`).join('')}
    </div>
    <div class="meta" style="margin:0 0 10px">筛出 <b>${shown.length}</b> 条 · 卖出 <b>${rangeQty}</b> 件 / <b>${money(rangeMoney)}</b>${rangeIn?(' · 进货 <b>'+rangeIn+'</b> 件'):''}${rangeAdj?(' · 调整 <b>'+(rangeAdj>0?'+':'')+rangeAdj+'</b>'):''}</div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="tbl"><thead><tr><th>类型</th><th>商品</th><th>库存变动</th><th>金额</th><th>日期</th><th>操作</th></tr></thead><tbody>
    ${view.length?view.map(s=>`<tr class="${s.gone?'gone':''}"><td><span class="tag ${s.type==='sale'?'t-out':(s.type==='purchase'?'t-ok':'t-cat')}">${s.type==='sale'?'卖':(s.type==='purchase'?'进':'调')}</span></td><td>${esc(s.name)}${s.gone?' <span class="tag t-slow">已删除</span>':''}</td><td class="${s.delta<0?'move-minus':'move-plus'}">${s.delta>0?'+':''}${s.delta}</td><td>${s.type==='adjust'?'—':money(s.money)}</td><td>${s.date.slice(5)}</td><td><span class="sale-del" onclick="delTx('${s.id}')">删除</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无记录</td></tr>'}
    ${view.length?`<tr class="sum-row"><td>合计</td><td colspan="2">卖出 ${rangeQty} 件 · 营业额 ${money(rangeMoney)}</td><td colspan="3">${rangeIn?('进货 '+rangeIn+' 件'):''}${rangeAdj?(' 调整 '+(rangeAdj>0?'+':'')+rangeAdj):''}</td></tr>`:''}
    </tbody></table>

  document.getElementById('page').innerHTML=h;

function setRecRange(k){recRange=k;renderPerformance();}

/* ============================================================
   库存盘点：拿实物数对账面数，差额自动记成一笔「库存调整」
   —— 这是库存「自证」的最后一环：任何时候你都能用实物把账校准回来，
      而且校准过程留痕，不会凭空改数字。
   ============================================================ */
function openStocktake(){
  openLayer(function(){
    document.getElementById('page').insertAdjacentHTML('beforeend',
      `<div class="mask" onclick="closeSheet()"></div>
       <div class="sheet" id="stkSheet"></div>`);
    renderStocktake();
  });
}
function renderStocktake(){
  const el=document.getElementById('stkSheet'); if(!el)return;
  const db=DB;
  const bad=db.products.filter(p=>isStockBad(p,db));
  const book=db.products.reduce((s,p)=>s+Number(p.stock||0),0);
  const hist=db.products.reduce((s,p)=>s+stockFromHistory(p,db),0);
  el.innerHTML=`
  <div class="sheet-h">🧮 库存盘点<button class="x" onclick="closeSheet()">×</button></div>
  <div class="stat-grid" style="margin-top:10px">
    <div class="stat" style="background:var(--primary)"><div class="n">${book}</div><div class="l">账面库存合计</div></div>
    <div class="stat" style="background:${bad.length?'var(--error)':'var(--success)'}"><div class="n">${hist}</div><div class="l">按流水推算合计</div></div>
  </div>
  <div class="meta" style="margin:10px 0 4px">${bad.length?('<b class="stk-bad">⚠ '+bad.length+' 个商品对不上</b>（多来自老数据流水不全）。逐个填实物数校正，或者一次性按现状重设期初：'):'✅ 全部对得上，库存可以放心信。'}</div>
  ${bad.length?'<button class="btn btn-ghost" style="margin-bottom:10px" onclick="acceptAllBaseline()">一次性按现状重设期初（'+bad.length+' 个）</button>':''}
  ${db.products.map(p=>{
    const drift=stockDrift(p,db),badOne=isStockBad(p,db),hist=stockFromHistory(p,db);
    return `<div class="row" style="align-items:flex-start;${badOne?'border-color:var(--error)':''}">
      <div class="thumb" style="width:44px;height:44px;flex:0 0 44px" onclick="preview('${p.image}')">${thumbHTML(p)}</div>
      <div style="flex:1;min-width:0">
        <div class="name" style="font-size:13.5px">${esc(p.name)}${Number(p.stock)<0?' <span class="badge-bad">负数</span>':''}${drift!==0?' <span class="badge-bad">对不上</span>':''}</div>
        <div class="meta">账面 <b>${p.stock}</b> · 推算 <b>${hist}</b> · 期初 ${Number(p.baseStock||0)}${drift!==0?(' · <span class="stk-bad">差 '+drift+'</span>'):''}</div>
        <div style="display:flex;gap:6px;margin-top:7px">
          <input class="input" id="stk${p.id}" type="number" placeholder="实物数" style="padding:8px 12px">
          <button class="btn btn-primary btn-xs" style="flex:0 0 auto" onclick="applyStocktake('${p.id}')">校正</button>
        </div>
        <div style="margin-top:6px"><span class="inline-btn" onclick="fillStk('${p.id}')">按推算值 ${hist}</span></div>
      </div>
    </div>`;
  }).join('')||'<div class="empty">还没有商品</div>'}
`;
}
function applyStocktake(pid){
  const p=DB.products.find(x=>x.id===pid); if(!p){toast('商品不存在');return;}
  const el=document.getElementById('stk'+pid);
  if(!el||el.value===''){toast('先填实物数量');return;}
  const real=Math.floor(Number(el.value));
  if(isNaN(real)){toast('实物数要填整数');return;}
  const delta=real-Number(p.stock||0);
  const wasDrift=stockDrift(p,DB);
  if(delta!==0) setStockTo(p,real,'盘点校正：实物 '+real);
  if(wasDrift!==0) rebaseline(p,DB);      // 历史偏差必须靠重设期初才能修掉
  const drift=stockDrift(p,DB);
  save();
  const parts=[];
  if(delta!==0) parts.push('库存 '+(delta>0?'+':'')+delta+' → '+p.stock);
  if(wasDrift!==0) parts.push('历史偏差 '+wasDrift+' 已归零');
  toast(drift===0?(parts.length?('已校正「'+p.name+'」：'+parts.join('，')):('「'+p.name+'」与账面一致'))
    :('⚠「'+p.name+'」仍对不上，请导出备份找我看'));
  renderStocktake();
  try{ if(cur==='products') renderProducts(); if(cur==='board') renderBoard(); }catch(_){ }
}
function fillStk(pid){
  const p=DB.products.find(x=>x.id===pid); if(!p)return;
  const el=document.getElementById('stk'+pid);
  if(el) el.value=stockFromHistory(p,DB);
}
/* 老数据常见情况：历史流水不全，导致一批商品「对不上」。
   把当前账面数字当作事实、批量重设期初，不改库存、只让账目从此自洽。 */
function acceptAllBaseline(){
  const bad=badStockList(DB);
  if(!bad.length){toast('没有需要处理的');return;}
  if(!confirm('把当前账面库存当作事实，重设这 '+bad.length+' 个商品的期初？\n不会改动任何库存数字，只是让账目从此对得上。')) return;
  const n=rebaselineAll(DB);
  save(); toast('已处理 '+n+' 个商品，库存与流水恢复一致');
  renderStocktake();
  try{ if(cur==='products') renderProducts(); if(cur==='board') renderBoard(); }catch(_){ }
}

function renderRestock(){
  const db=DB;const arr=db.products.map(p=>({p,a:analytics(p,db)}));
  const needList=arr.filter(x=>x.a.need>0).sort((x,y)=>y.a.avgDaily-x.a.avgDaily)
    .map(x=>({id:x.p.id,name:x.p.name,image:x.p.image,stock:x.p.stock,avg:x.a.avgDaily.toFixed(1),need:x.a.need,cost:x.p.cost,price:x.p.price}));
  const slowList=arr.filter(x=>x.a.slow&&x.p.stock>0).sort((x,y)=>idleSortKey(y.a.idleDays)-idleSortKey(x.a.idleDays))
    .map(x=>({id:x.p.id,name:x.p.name,total:x.a.totalSold,stock:x.p.stock,cover:coverText(x.p.stock,x.a.coverDays),idle:x.a.idleDays,never:x.a.never}));
  const needQty=needList.reduce((s,x)=>s+x.need,0);
  const cost=Math.round(needList.reduce((s,x)=>s+x.need*x.cost,0));
  const income=Math.round(needList.reduce((s,x)=>s+x.need*x.price,0));
  let h=`
  <div class="stat-grid">
    <div class="stat" style="background:var(--primary)"><div class="n">${needQty}</div><div class="l">需补货总数</div></div>
    <div class="stat" style="background:var(--orange)"><div class="n">${money(cost)}</div><div class="l">预计进货成本</div></div>
    <div class="stat" style="background:var(--pink)"><div class="n">${money(income)}</div><div class="l">预计可收回</div></div>
    <div class="stat" style="background:var(--blue)"><div class="n">${slowList.length}</div><div class="l">滞销别进</div></div>
  </div>
  <div class="section-title">📥 建议进货清单</div>
  <div class="card" style="padding:0;overflow:hidden">${needList.length?`
    <table class="tbl"><thead><tr><th>商品</th><th>库存</th><th>日均</th><th>建议进</th><th>补货</th></tr></thead><tbody>
    ${needList.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.stock}</td><td>${x.avg}</td><td><b style="color:var(--primary-d)">${x.need}</b></td><td><button class="btn btn-primary btn-xs" onclick="openPick('purchase','${x.id}','补货')">记</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂时不用补货，库存充足 👍</div>'}</div>
  <div class="section-title">🐌 滞销别进清单（${slowList.length} 个 · 按最久没卖排）</div>
  <div class="card">${slowList.length?slowList.map(x=>`<div style="padding:6px 0"><div class="name" style="font-size:14px">${esc(x.name)} <span class="tag t-slow">${x.never?'从未卖出':'滞销'}</span></div><div class="meta">${idleText(x.idle)} · 现存 ${x.stock} 件 · 近${db.settings.periodDays}天卖 ${x.total} 件</div></div>`).join(''):'<div class="empty">没有滞销商品，棒！</div>'}</div>`;
  document.getElementById('page').innerHTML=h;
}

/* ============ 交互逻辑 ============ */
function saveSettings(){
  const rd=parseInt(document.getElementById('restockDays').value,10)||7;
  const pd=parseInt(document.getElementById('periodDays').value,10)||30;
  const dsEl=document.getElementById('defaultSafety');
  const ds=dsEl?parseInt(dsEl.value,10):10;
  const slowNum=function(id,def,isFloat){
    const el=document.getElementById(id); if(!el) return def;
    const v=isFloat?parseFloat(el.value):parseInt(el.value,10);
    return isNaN(v)?def:v;
  };
  const sd=slowNum('slowDays',14,false);
  const st=slowNum('slowThreshold',0.2,true);
  const si=slowNum('slowIdleDays',21,false);
  const smEl=document.getElementById('slowMode');
  const sm=(smEl&&smEl.value==='abs')?'abs':'idle';
  DB.settings.restockDays=rd;DB.settings.periodDays=pd;DB.settings.defaultSafety=isNaN(ds)?10:ds;
  DB.settings.slowDays=sd;
  DB.settings.slowMode=sm;
  DB.settings.slowIdleDays=Math.max(1,si);
  DB.settings.slowThreshold=st;
  save();toast('已保存');render();
}
/* 切换判定方式：只显示当前方式对应的输入框，并刷新试算 */
function onSlowModeChange(){
  const m=(document.getElementById('slowMode')||{}).value||'idle';
  const rb=document.getElementById('slowIdleBox'), ab=document.getElementById('slowAbsBox');
  if(rb)rb.style.display=(m==='abs')?'none':'block';
  if(ab)ab.style.display=(m==='abs')?'block':'none';
  updateSlowPreview();
}
/* 试算：把输入框里的值临时套上去，告诉你「这样设置会判出几个滞销」，不落盘 */
function updateSlowPreview(){
  const el=document.getElementById('slowPreview'); if(!el)return;
  const trial=JSON.parse(JSON.stringify(DB.settings||{}));
  const gv=function(id,f){const e=document.getElementById(id);if(!e)return null;return f(e.value);};
  const sd=gv('slowDays',function(v){return parseInt(v,10);}); if(sd!=null&&!isNaN(sd))trial.slowDays=sd;
  const smEl=document.getElementById('slowMode'); if(smEl)trial.slowMode=(smEl.value==='abs')?'abs':'idle';
  const si=gv('slowIdleDays',function(v){return parseInt(v,10);}); if(si!=null&&!isNaN(si))trial.slowIdleDays=si;
  const st=gv('slowThreshold',function(v){return parseFloat(v);}); if(st!=null&&!isNaN(st))trial.slowThreshold=st;
  el.innerHTML=slowPreviewText({products:DB.products,tx:DB.tx,settings:trial,rev:DB.rev});
}
function slowPreviewText(db){
  const s=db.settings||{};
  let eligible=0,slow=0,never=0;
  db.products.forEach(function(p){
    try{
      const st=slowStat(p,db);
      if(st.eligible)eligible++;
      if(st.slow)slow++;
      if(st.never&&Number(p.stock||0)>0)never++;
    }catch(_){}
  });
  const how=(s.slowMode||'idle')==='abs'
    ? ('近 '+(s.periodDays||30)+' 天日均销量低于 '+(s.slowThreshold!=null?s.slowThreshold:0.2)+' 件')
    : ('距上次卖出超过 '+(s.slowIdleDays!=null?s.slowIdleDays:21)+' 天（从未卖出的全算）');
  return '按当前设置试算：'+db.products.length+' 个商品里，有库存且上架已满 '+(s.slowDays!=null?s.slowDays:14)+' 天的有 <b>'+eligible+'</b> 个，其中会标为滞销的有 <b>'+slow+'</b> 个'
    +(never?'（含从未卖出过的 '+never+' 个）':'')+'。<br>判定口径：'+how+'。调完记得点下面「保存判定设置」。';
}
function catTemplateListHTML(){
  const tpl=DB.settings.catTemplates||[];
  if(!tpl.length) return '<div class="empty" style="padding:10px 0">还没有分类，下面添加或在新增商品时点「＋ 新建分类」</div>';
  return tpl.map(function(c,i){return '<div class="row" style="margin-bottom:6px"><div style="flex:1" class="name">'+esc(c)+'</div><span class="inline-btn" onclick="renameCatTemplate('+i+')">✏️ 改名</span><span class="sale-del" style="margin-left:10px" onclick="delCatTemplate('+i+')">× 删除</span></div>';}).join('');
}
/* 分类改名：模板改名，并可选把已用该分类的商品一起改过去 */
function renameCatTemplate(i){
  const tpl=DB.settings.catTemplates||[];
  if(i<0||i>=tpl.length)return;
  const old=tpl[i];
  const n=(window.prompt('修改分类名称：',old)||'').trim();
  if(!n||n===old)return;
  if(tpl.indexOf(n)!==-1){toast('已有同名分类');return;}
  const used=DB.products.filter(function(p){return (p.cat||'')===old;});
  let move=true;
  if(used.length){
    move=confirm('有 '+used.length+' 个商品的分类是「'+old+'」。\n\n确定 = 分类和这些商品一起改成「'+n+'」\n取消 = 只改分类名，商品仍留在「'+old+'」（会变成未收录分类）');
  }
  tpl[i]=n;
  if(move)used.forEach(function(p){p.cat=n;});
  save();renderSettings();
  toast(move&&used.length?('已改名，'+used.length+' 个商品同步更新'):'已改名');
}
function addCatTemplate(){
  const v=(document.getElementById('catTplNew').value||'').trim();
  if(!v){toast('请输入分类名');return;}
  const tpl=DB.settings.catTemplates||(DB.settings.catTemplates=[]);
  if(tpl.indexOf(v)!==-1){toast('已存在');return;}
  tpl.push(v);save();renderSettings();
}
function delCatTemplate(i){
  const tpl=DB.settings.catTemplates||[];
  if(i<0||i>=tpl.length)return;
  if(!confirm('删除分类模板「'+tpl[i]+'」？已用该分类的商品不受影响。'))return;
  tpl.splice(i,1);save();renderSettings();
}
function exportData(){
  const json=JSON.stringify(DB);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='yeshi_backup_'+todayISO().replace(/-/g,'')+'.json';a.click();
  URL.revokeObjectURL(a.href);toast('已导出文件');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{let data;try{data=JSON.parse(r.result);}catch(e){toast('文件无效');return;}
      if(!data.products){toast('缺少商品数据');return;}
      if(confirm('导入将覆盖当前所有数据，确定继续？')){if(data.settings===undefined)data.settings={restockDays:7,periodDays:30};DB=data;save();toast('导入成功');render();}};
    r.readAsText(f);};
  inp.click();
}
function clearSample(){
  if(confirm('将删除全部商品和交易记录，且不会恢复示例数据。确定？')){DB.products=[];DB.tx=[];save();toast('已清空');render();}
}

/* 删除一笔流水（售出/进货/调整通用）：删掉多少，库存就按同样幅度反向回去 */
function delTx(id){
  const tx=DB.tx.find(x=>x.id===id);if(!tx)return;
  const p=DB.products.find(y=>y.id===tx.productId);
  const pname=p?p.name:'该商品';
  const kind=tx.type==='sale'?'卖出':(tx.type==='purchase'?'进货':'库存调整');
  let effect='';
  if(p){
    const back=-txDelta(tx);
    effect=back>0?('，库存加回 '+back+' 个。'):('，库存减掉 '+Math.abs(back)+' 个。');
  }
  if(!confirm('删除这笔记录？\n「'+pname+' '+kind+' '+tx.qty+'」'+(p?effect:'')+'\n\n删记录会同步改库存，请确认没删错。')) return;
  if(p)p.stock=Number(p.stock||0)-txDelta(tx);
  DB.tx=DB.tx.filter(x=>x.id!==id);
  const drift=p?stockDrift(p,DB):0;
  save();
  toast(drift===0?('已删除「'+pname+'」的'+kind+'记录'):'⚠ 已删除，但库存校验未通过，请盘点');
  render();
}

/* ============================================================
   v2 记一笔：两步式
   第 1 步 带照片网格 + 吸顶的搜索/分类 → 选商品（列表按累计销量降序，卖得好的在前）
   第 2 步 数量（含快捷数量）+ 成交单价（含标价/折扣）+ 卖出日期 + 备注 → 确认
   ============================================================ */
let _pickCatNames=['__all__'];
function openPick(type,pid,label){
  if(pid){ openTxStep(type,pid,label||''); return; }
  openLayer(function(){
    window._pick={type:type||'sale',cat:'__all__',kw:'',label:label||''};
    const h=`<div class="mask" onclick="closeSheet()"></div>
    <div class="sheet" id="pickSheet"></div>`;
    document.getElementById('page').insertAdjacentHTML('beforeend',h);
    renderPick();
  });
}
function pickCats(){
  const map={};
  DB.products.forEach(p=>{const c=(p.cat||'').trim()||'未分类';map[c]=(map[c]||0)+1;});
  return Object.keys(map).map(c=>({c:c,n:map[c]})).sort((a,b)=>b.n-a.n||a.c.localeCompare(b.c,'zh'));
}
/* 选商品列表：先按分类/搜索过滤，再按「累计销量」降序 —— 卖得好的排最前，手机上最好找。
   不提供排序方式选择器：固定按销量排就够了。同一销量时按名称稳定排序，避免顺序乱跳。 */
function pickRows(){
  const st=window._pick||{};
  const kw=(st.kw||'').trim().toLowerCase();
  return DB.products.filter(p=>{
    if(st.cat&&st.cat!=='__all__'&&((p.cat||'').trim()||'未分类')!==st.cat)return false;
    if(kw&&String(p.name||'').toLowerCase().indexOf(kw)===-1)return false;
    return true;
  }).map(p=>({p:p,sold:allTime(p,DB).qty}))
    .sort((x,y)=>y.sold-x.sold||String(x.p.name||'').localeCompare(String(y.p.name||''),'zh'));
}
function pickGridHTML(rows,type){
  if(!rows.length) return '<div class="empty">没有匹配的商品</div>';
  return `<div class="pick-grid">${rows.map(r=>{
    const p=r.p, noStock=type==='sale'&&Number(p.stock||0)<=0;
    return `<div class="pick-item ${noStock?'dis':''}" onclick="pickChoose('${p.id}')">
      <div class="ph">${p.image?`<img src="${p.image}">`:'🧸'}</div>
      <div class="bd">
        <div class="nm">${esc(p.name)}</div>
        <div class="mt"><span>${esc(p.cat)||'未分类'}</span><span class="r">${type==='sale'?'库存 '+p.stock:'进¥'+p.cost}</span></div>
        <div class="mt"><span>累计卖出 <span class="pick-sold">${r.sold}</span> 件</span></div>
      </div>
    </div>`;}).join('')}</div>`;
}
function renderPick(){
  const st=window._pick||{type:'sale',cat:'__all__',kw:'',label:''};
  const db=DB;
  const cats=pickCats();
  _pickCatNames=['__all__'].concat(cats.map(c=>c.c));
  if(st.cat!=='__all__' && !cats.some(c=>c.c===st.cat)) st.cat='__all__';
  const title=st.type==='sale'?'⚡ 选择要卖出的商品':(st.label==='补货'?'🛒 选择要补货的商品':'📥 选择要进货的商品');
  const el=document.getElementById('pickSheet');if(!el)return;
  el.className='sheet pick-sheet';
  el.innerHTML=`
  <div class="pick-head">
    <div class="sheet-h">${title}<button class="x" onclick="closeSheet()">×</button></div>
    <input class="input" id="pickKw" placeholder="🔍 搜索商品名" value="${esc(st.kw)}" oninput="pickSearch(this.value)">
    <div class="chipbar">
      <span class="chip ${st.cat==='__all__'?'on':''}" onclick="pickCat(0)">全部 ${db.products.length}</span>
      ${cats.map((c,i)=>`<span class="chip ${st.cat===c.c?'on':''}" onclick="pickCat(${i+1})">${esc(c.c)} ${c.n}</span>`).join('')}
    </div>
  </div>
  <div class="pick-body" id="pickBody">
    ${pickGridHTML(pickRows(),st.type)}
  </div>
  <div class="pick-foot">
    <button class="btn btn-ghost" onclick="openAdd()">＋ 新增商品</button>
  </div>`;
}
function pickSearch(v){
  const st=window._pick;if(!st)return;
  st.kw=v;
  // 只换掉网格本身：输入框不动，焦点与光标位置得以保留
  const body=document.getElementById('pickBody');if(!body)return;
  const html=pickGridHTML(pickRows(),st.type);
  const holder=body.querySelector('.pick-grid,.empty');
  if(holder){ holder.insertAdjacentHTML('beforebegin',html); holder.remove(); }
  else body.insertAdjacentHTML('afterbegin',html);
}
function pickCat(i){window._pick.cat=_pickCatNames[i]||'__all__';renderPick();}
function pickChoose(pid){
  const st=window._pick||{type:'sale',label:''};
  const p=DB.products.find(x=>x.id===pid);if(!p)return;
  if(st.type==='sale'&&p.stock<=0){toast('「'+p.name+'」库存 0，先补货再卖');return;}
  openTxStep(st.type,pid,st.label||'');
}

/* 第 2 步的「← 返回」/「换一个」：退回选商品列表。
   上一层就是选商品时直接退回去（历史也会跟着退），否则新开一个选商品列表。 */
function txBack(type,label){
  if(_layerStack.length>1){ history.back(); }
  else { openPick(type,'',label||''); }
}

/* 第 2 步：数量 + 单价 + 卖出日期 + 备注 */
function openTxStep(type,pid,label){
  const pFind=DB.products.find(x=>x.id===pid);
  if(!pFind){toast('商品不存在');return;}
  openLayer(function(){
    const p=DB.products.find(x=>x.id===pid)||pFind;   // 重建这一层时按 id 重新取，避免用到旧对象
    window._tx={type:type,pid:pid,label:label||''};
    const isSale=type==='sale';
    const defPrice=p.price;
    const h=`<div class="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="txSheet">
    <div class="sheet-h" style="gap:8px">
      <button class="x" title="返回选商品" onclick="txBack('${type}','${label||''}')">←</button>
      <div style="flex:1;min-width:0;text-align:center">${isSale?'⚡ 确认卖出':(label==='补货'?'🛒 确认补货':'📥 确认进货')}</div>
      <button class="x" onclick="closeSheet()">×</button>
    </div>
    <div class="row" style="margin-bottom:12px">
      <div class="thumb" onclick="preview('${p.image}')">${thumbHTML(p)}</div>
      <div style="flex:1;min-width:0">
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(p.cat)||'未分类'} · 库存 ${p.stock} · 标价 ¥${p.price}</div>
      </div>
      <button class="btn btn-ghost btn-xs" onclick="txBack('${type}','${label||''}')">换一个</button>
    </div>
    <label class="label">数量</label>
    <div class="qty-row">
      <button class="qty-btn" onclick="bumpQty(-1)">−</button>
      <input class="input qty-input" id="txQty" type="number" inputmode="numeric" value="1" oninput="updTxTotal()">
      <button class="qty-btn" onclick="bumpQty(1)">＋</button>
    </div>
    <div class="chip-list" style="margin-top:8px">
      ${[1,2,3,5,10].map(n=>`<span class="chip" onclick="setQty(${n})">${n}</span>`).join('')}
      ${isSale&&p.stock>0?`<span class="chip chip-price" onclick="setQty(${p.stock})">全部 ${p.stock}</span>`:''}
    </div>
    ${isSale?`
    <label class="label">成交单价（讲价就改这里，默认标价 ¥${defPrice}）</label>
    <input class="input" id="txPrice" type="number" value="${defPrice}" oninput="updTxTotal()">
    <div class="chip-list" style="margin-top:8px">
      <span class="chip chip-price" onclick="setPrice(${defPrice})">按标价 ¥${defPrice}</span>
      ${[[0.9,9],[0.8,8],[0.5,5]].map(kv=>`<span class="chip" onclick="setPrice(${Math.round(defPrice*kv[0]*100)/100})">${kv[1]}折 ¥${Math.round(defPrice*kv[0]*100)/100}</span>`).join('')}
    </div>`:''}
    <div class="sum-box">
      <div class="l1"><span id="txTotalLabel">${isSale?'本笔合计':'本笔进货成本'}</span><b style="color:var(--primary-d);font-size:19px" id="txTotal">¥0.00</b></div>
      <div class="l2" id="txAfter"></div>
    </div>
    ${isSale?`
    <label class="label">卖出日期（忘了当天记，可改成那天）</label>
    <input class="input" id="txDate" type="date" value="${todayISO()}" max="${todayISO()}" onchange="updTxDateHint()">
    <div class="chip-list" style="margin-top:8px">
      <span class="chip" onclick="setTxDate(0)">今天</span>
      <span class="chip" onclick="setTxDate(1)">昨天</span>
      <span class="chip" onclick="setTxDate(2)">前天</span>
    </div>
    <div class="meta" id="txDateHint" style="margin-top:6px"></div>`:''}
    <label class="label">备注（可选）</label>
    <input class="input" id="txNote" placeholder="${isSale?'如：客人讲价 / 摊位A':'如：进货渠道'}">
    <button class="btn btn-primary" style="margin-top:14px" onclick="confirmTx('${type}','${pid}','${label||''}')">${isSale?'确认卖出':(label==='补货'?'确认补货':'确认进货')}</button>
  </div>`;
  document.getElementById('page').insertAdjacentHTML('beforeend',h);
    updTxTotal();
    updTxDateHint();
  });
}
function setQty(n){const el=document.getElementById('txQty');if(el)el.value=Math.max(1,Math.floor(n));updTxTotal();}
function bumpQty(d){const el=document.getElementById('txQty');if(!el)return;el.value=Math.max(1,(Math.floor(Number(el.value)||0))+d);updTxTotal();}
function setPrice(v){const el=document.getElementById('txPrice');if(el)el.value=v;updTxTotal();}
/* 卖出日期：默认今天。忘记当天记账时选「昨天/前天」补上，统计仍会落在正确的那一天。
   只到「日」不到「时分」：全部统计与日历都是按天口径，多一位时分会让它们全部失真。 */
function setTxDate(back){
  const el=document.getElementById('txDate');if(!el)return;
  const d=new Date();d.setDate(d.getDate()-Math.max(0,Math.floor(back)||0));
  el.value=d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
  updTxDateHint();
}
function updTxDateHint(){
  const el=document.getElementById('txDateHint');if(!el)return;
  const inp=document.getElementById('txDate');
  const v=inp?String(inp.value||'').slice(0,10):'';
  const t=todayISO();
  if(!v){ el.innerHTML=''; return; }
  el.innerHTML=(v===t)?'':'<b style="color:var(--primary-d)">补记</b>：这笔会算在 '+v.slice(5,7)+'月'+v.slice(8,10)+'日'; 
}
function updTxTotal(){
  const ts=window._tx;if(!ts)return;
  const p=DB.products.find(x=>x.id===ts.pid);if(!p)return;
  const isSale=ts.type==='sale';
  const qty=Math.max(0,Math.floor(Number((document.getElementById('txQty')||{}).value)||0));
  const pe=document.getElementById('txPrice');
  const price=pe?(Number(pe.value)||0):0;
  const total=isSale?price*qty:p.cost*qty;
  const el=document.getElementById('txTotal');if(el)el.textContent='¥'+total.toFixed(2);
  const after=isSale?(p.stock-qty):(p.stock+qty);
  const a2=document.getElementById('txAfter');
  if(a2)a2.innerHTML=isSale
    ?('卖出后库存：<b style="color:'+(after<0?'var(--error)':'var(--ink2)')+'">'+after+'</b>'+(after<0?'（超出库存，会记为负数）':''))
    :('补货后库存：<b>'+after+'</b>');
}
function confirmTx(type,pid,label){
  const p=DB.products.find(x=>x.id===pid);if(!p){toast('商品不存在');return;}
  const qty=Math.floor(Number((document.getElementById('txQty')||{}).value)||0);
  if(qty<=0){toast('数量需大于 0');return;}
  const isSale=type==='sale';
  if(isSale&&qty>p.stock){if(!confirm('「'+p.name+'」库存只有 '+p.stock+'，仍记为卖出 '+qty+' 吗？'))return;}
  const price=isSale?(Number((document.getElementById('txPrice')||{}).value)||0):0;
  const amount=isSale?price*qty:p.cost*qty;
  const note=(document.getElementById('txNote')||{}).value||'';
  /* 卖出日期：默认今天；允许补记到过去（隔天忘了记）。未来日期不接受，非法值一律回退到今天。 */
  let date=todayISO();
  if(isSale){
    const dv=String((document.getElementById('txDate')||{}).value||'').slice(0,10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(dv)) date=dv;
    if(date>todayISO()) date=todayISO();
  }
  const late=isSale&&date!==todayISO();
  /* 补记最容易出的事故是「重复记」：那天其实已经记过了，再记一遍库存就少扣。
     所以只在补记时问一句；当天同一商品卖好几件是正常生意，不打扰。 */
  if(late){
    const dup=DB.tx.filter(t=>t.productId===pid&&t.type==='sale'&&t.date===date);
    if(dup.length){
      const dq=dup.reduce((s,t)=>s+Number(t.qty||0),0);
      if(!confirm('「'+p.name+'」在 '+date.slice(5)+' 已经记过 '+dq+' 件卖出。\n再记一笔会重复扣库存，确定要记吗？')) return;
    }
  }
  /* 记账与改库存是同一次原子动作：pushMove 里同时写流水 + 改库存，两者不可能不一致 */
  pushMove(p,isSale?'sale':'purchase',qty,note,{amount:amount,date:date});
  const after=p.stock;
  const drift=stockDrift(p,DB);                 // 记完立刻自证一次
  save();closeSheet();
  const okMsg=isSale?(late?('已补记「'+p.name+'」'+date.slice(5).replace('-','月')+'日的 '+qty+' 件，剩余库存 '+after)
                          :('已卖出「'+p.name+'」'+qty+' 件，剩余库存 '+after))
    :((label==='补货'?'已补货「':'已进货「')+p.name+'」'+qty+' 件，库存 '+after);
  toast(drift===0?okMsg:('⚠ 已记账，但库存校验未通过，请到「商品 → 库存盘点」核对'));
  render();
}
/* ============================================================
   弹层层级 + 浏览历史（修复「点了记一笔之后没得返回」）
   旧写法只是往 #page 里插一段 HTML，浏览历史里什么都没留下：
   手机上按返回键/侧滑 → 关不掉弹层；加到主屏幕独立运行时更是完全没反应；
   配合浏览器时按返回还会把整个页面退出去。看起来就是「没得返回」。
   现在：每开一层弹层就压一条历史，返回键 = 退回上一层，退到底就关掉弹层。
   ============================================================ */
let _layerStack=[];  // 每层存一个「重建函数」，返回时用它把上一层重新画出来
let _histDepth=0;    // 实际压进浏览历史的条目数（pushState 失败时不会虚增）
let _selfBack=0;     // 自己调 history.go() 时要忽略掉同样次数的 popstate

function _clearSheets(){
  document.querySelectorAll('.mask,.sheet').forEach(e=>e.remove());
  window._tx=null;window._pick=null;
}
/* 打开一层：先清屏（同屏只留最上面那层），再画，再压一条历史 */
function openLayer(build){
  _clearSheets();
  build();
  _layerStack.push(build);
  try{history.pushState({wbLayer:_histDepth+1},'',location.href);_histDepth++;}catch(e){}
}
/* 把栈顶那一层重新画一遍（返回上一层 / 刷新当前层都走这里） */
function _renderTop(){
  _clearSheets();
  const top=_layerStack[_layerStack.length-1];
  if(top)top();
}
/* × / 点遮罩 / 记完账：一次性收起所有层，并把历史一起退回去 */
function closeSheet(){
  const had=!!document.querySelector('.mask,.sheet');
  _clearSheets();
  _layerStack.length=0;
  if(had&&_histDepth>0){
    const n=_histDepth;_histDepth=0;
    _selfBack+=n;
    try{history.go(-n);}catch(e){_selfBack=0;}
    clearTimeout(closeSheet._t);
    closeSheet._t=setTimeout(function(){_selfBack=0;},900);  // 兜底：别让下一次真返回被吃掉
  }
}
window.addEventListener('popstate',function(){
  if(_selfBack>0){_selfBack--;return;}   // 自己触发的，跳过
  if(_histDepth>0)_histDepth--;
  if(!_layerStack.length)return;         // 没弹层 = 真正的页面级返回，放行
  _layerStack.pop();
  _renderTop();
});

/* 商品增改删 */
function openAdd(){openProductSheet('');}
function openEdit(pid){
  const p=DB.products.find(x=>x.id===pid);if(!p)return;
  openProductSheet(p);
}
function openProductSheet(p){
  const isEdit=!!p;
  openLayer(function(){
  const h=`<div class="mask" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="sheet-h">${isEdit?'编辑商品':'新增商品'}<button class="x" onclick="closeSheet()">×</button></div>
    <label class="label">名称</label><input class="input" id="pName" value="${isEdit?esc(p.name):''}">
    <label class="label">分类（选模板，或新建）</label>
    <select class="input" id="pCat" data-last="${isEdit?esc(p.cat):''}" onchange="onCatChange('pCat')">${catOptionsHTML(isEdit?p.cat:'')}</select>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label class="label">进货价</label><input class="input" id="pCost" type="number" value="${isEdit?p.cost:''}"></div>
      <div style="flex:1"><label class="label">售价</label><input class="input" id="pPrice" type="number" value="${isEdit?p.price:''}"></div>
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex:1"><label class="label">当前库存</label><input class="input" id="pStock" type="number" value="${isEdit?p.stock:''}"></div>
      <div style="flex:1"><label class="label">预警线</label><input class="input" id="pSafe" type="number" value="${isEdit?p.safetyStock:(DB.settings.defaultSafety!=null?DB.settings.defaultSafety:'')}"></div>
    </div>
    <label class="label">商品图片（可选）</label>
    <input class="input" id="pImg" type="file" accept="image/*" style="padding:8px">
    <button class="btn btn-primary" style="margin-top:14px" onclick="saveProduct('${isEdit?p.id:''}')">保存</button>
    ${isEdit?`<div class="del-zone"><div class="del-divider"></div><button class="btn btn-del" id="delBtn" onclick="armDelete('${p.id}')">🗑 删除此商品</button><div class="del-hint" id="delHint">删除后该商品及全部销售记录将无法恢复</div></div>`:''}
  </div>`;
  document.getElementById('page').insertAdjacentHTML('beforeend',h);
  });
}
function saveProduct(editId){
  const name=(document.getElementById('pName').value||'').trim();
  if(!name){toast('请填写商品名称');return;}
  const f=document.getElementById('pImg').files[0];
  const finish=(img)=>{
    const stockEl=document.getElementById('pStock');
    const newStock=stockEl?(Number(stockEl.value)||0):0;
    const data={name:name,cat:(document.getElementById('pCat').value||'').trim(),cost:Number(document.getElementById('pCost').value)||0,price:Number(document.getElementById('pPrice').value)||0,safetyStock:Number(document.getElementById('pSafe').value)||0,unit:'个',image:img};
    let msg='',drift=0;
    if(editId){
      const p=DB.products.find(x=>x.id===editId);
      Object.assign(p,data);
      /* 手动改库存不允许"悄悄改"：差额自动记成一笔「库存调整」，等式照样成立、事后查得到 */
      if(Number(p.stock||0)!==newStock){
        setStockTo(p,newStock,'编辑商品时手改库存');
        msg='已保存「'+name+'」，库存已由手改同步为 '+p.stock+'（并记了一笔调整）';
      }else{
        msg='已保存「'+name+'」';
      }
      drift=stockDrift(p,DB);
    }else{
      /* 新增商品：这个数就是「期初库存」，是库存恒等式的起点 */
      DB.products.push(Object.assign({id:uid(),createdAt:Date.now(),stock:newStock,baseStock:newStock},data));
      msg='已添加「'+name+'」，期初库存 '+newStock;
    }
    save();closeSheet();
    toast(drift===0?msg:'⚠ 已保存，但库存校验未通过，请盘点');
    render();
  };
  if(f){compressImage(f,finish);}else{
    if(editId){const orig=DB.products.find(x=>x.id===editId);finish(orig.image||'');}else finish('');
  }
}
function deleteProduct(pid,pname){
  if(!confirm('确定删除「'+pname+'」吗？它的销售记录也会一并删除，无法恢复。'))return;
  DB.products=DB.products.filter(p=>p.id!==pid);
  DB.tx=DB.tx.filter(t=>t.productId!==pid);
  idbDel(pid).catch(function(){});
  save();closeSheet();toast('已删除「'+(pname||'商品')+'」');render();
}
let _delTimer=null;
function armDelete(pid){
  const btn=document.getElementById('delBtn');
  if(!btn)return;
  if(btn.dataset.armed==='1'){
    clearTimeout(_delTimer);
    const p=DB.products.find(x=>x.id===pid);
    deleteProduct(pid,p?p.name:'');
  }else{
    btn.dataset.armed='1';btn.classList.add('armed');btn.textContent='⚠ 再次点击确认删除';
    const hint=document.getElementById('delHint');if(hint)hint.textContent='5 秒内不再点击，将自动取消';
    _delTimer=setTimeout(function(){if(btn){btn.dataset.armed='';btn.classList.remove('armed');btn.textContent='🗑 删除此商品';const h2=document.getElementById('delHint');if(h2)h2.textContent='删除后该商品及全部销售记录将无法恢复';}},5000);
  }
}
function batchImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=()=>{const files=Array.from(inp.files).slice(0,9);if(!files.length)return;
    toast('正在处理图片…');
    let done=0;const rows=new Array(files.length);
    files.forEach((f,i)=>{compressImage(f,(img)=>{rows[i]={image:img,name:'',cost:'',price:'',stock:''};done++;if(done===files.length)showImportSheet(rows);});});
  };
  inp.click();
}
function showImportSheet(rows){
  openLayer(function(){
  const h=`<div class="mask" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="sheet-h">批量导入（${rows.length}张）<button class="x" onclick="closeSheet()">×</button></div>
    <label class="label">统一分类（可选，下拉选择）</label>
    <select class="input" id="impCat" data-last="" onchange="onCatChange('impCat')">${catOptionsHTML('')}</select>
    <div style="max-height:55vh;overflow:auto">
    ${rows.map((r,i)=>`<div class="card" style="margin-bottom:8px">
      <div style="display:flex;gap:10px;align-items:center">
        <div class="thumb" style="width:44px;height:44px;flex:0 0 44px"><img src="${r.image}"></div>
        <input class="input" placeholder="商品名" value="" onchange="impF(${i},'name',this.value)">
      </div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <input class="input" placeholder="进" onchange="impF(${i},'cost',this.value)">
        <input class="input" placeholder="售" onchange="impF(${i},'price',this.value)">
        <input class="input" placeholder="库存" onchange="impF(${i},'stock',this.value)">
      </div></div>`).join('')}
    </div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="confirmImport()">确认导入</button>
  </div>`;
  window._imp=rows;
  document.getElementById('page').insertAdjacentHTML('beforeend',h);
  });
}
function impF(i,f,v){if(window._imp[i])window._imp[i][f]=v;}
function confirmImport(){
  let added=0,skip=0;
  const defSafe=DB.settings.defaultSafety!=null?DB.settings.defaultSafety:10;
  const catEl=document.getElementById('impCat');
  let catVal=catEl?catEl.value.trim():'';if(catVal==='__new__')catVal='';
  (window._imp||[]).forEach(it=>{const name=(it.name||'').trim();if(!name){skip++;return;}if(DB.products.some(p=>p.name===name)){skip++;return;}
    const impStock=Number(it.stock)||0;
    DB.products.push({id:uid(),createdAt:Date.now(),name,cat:catVal,cost:Number(it.cost)||0,price:Number(it.price)||0,stock:impStock,baseStock:impStock,safetyStock:defSafe,unit:'个',image:it.image||''});added++;});
  save();closeSheet();toast('导入 '+added+' 个'+(skip?(' 跳过'+skip):''));render();
}
function preview(img){if(img)window.open(img,'_blank');}

/* 兼容旧调用名 */
function openSheet(type,pid,label){openPick(type,pid,label);}

load();
snapshotDaily();        // 每天第一次打开自动留一份快照，出问题能退回去
bindStorageSync();      // 监听其他窗口的改动，防止两边互相覆盖把库存写坏
document.getElementById('fab').style.display='block';
renderTabbar();
try { render(); } catch (err) { showFatal((err && err.stack) || (err && err.message) || err); }
renderAlertBar();

  /* 彻底移除 Service Worker：之前正是它在部分手机上把页面缓存成空白。
     改为普通网页，每次都从服务器拉最新，不再被缓存拦截。 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
    }).catch(function () {});
  }
</script>
